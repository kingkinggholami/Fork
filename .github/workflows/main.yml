
name: Browser Recorder - noVNC

on:
  workflow_dispatch:
    inputs:
      website:
        description: "آدرس سایت"
        required: true
        type: string
        default: "https://example.com"

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==================================================
      # 1. اجرای Chromium + noVNC + CDP
      # ==================================================

      - name: Start Chromium
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASSWORD=your_password \
            -e DISPLAY_WIDTH=1280 \
            -e DISPLAY_HEIGHT=720 \
            -e CHROMIUM_REMOTE_DEBUGGING=1 \
            -e CHROMIUM_REMOTE_DEBUGGING_PORT=9222 \
            -e KEEP_APP_RUNNING=1 \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

      # ==================================================
      # 2. بررسی وضعیت کانتینر
      # ==================================================

      - name: Check Chromium
        run: |
          echo "⏳ منتظر Chromium..."

          for i in {1..60}; do

            if curl -fs http://127.0.0.1:5800 > /dev/null 2>&1; then
              echo "✅ noVNC آماده است"
              break
            fi

            echo "⏳ تلاش $i/60"
            sleep 2

          done

          echo ""
          echo "========== DOCKER =========="
          docker ps
          echo "============================"

          echo ""
          echo "========== LOGS ============"
          docker logs --tail 100 chromium || true
          echo "============================"

      # ==================================================
      # 3. صبر برای CDP
      # ==================================================

      - name: Wait for Chrome DevTools
        run: |
          echo "⏳ منتظر Chrome DevTools Protocol..."

          for i in {1..60}; do

            if curl -fs http://127.0.0.1:9222/json/version > /tmp/cdp.json 2>/dev/null; then

              echo "✅ CDP آماده است"
              echo ""

              cat /tmp/cdp.json

              break
            fi

            echo "⏳ CDP هنوز آماده نیست... $i/60"
            sleep 2

          done

          echo ""

          if ! curl -fs http://127.0.0.1:9222/json/version > /dev/null 2>&1; then
            echo "❌ CDP بالا نیامد"
            echo ""
            echo "========== Chromium logs =========="
            docker logs --tail 200 chromium || true
            echo "==================================="
            exit 1
          fi

      # ==================================================
      # 4. نصب Node.js
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==================================================
      # 5. نصب Playwright
      # ==================================================

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      # ==================================================
      # 6. ساخت Recorder
      # ==================================================

      - name: Create Recorder
        run: |

          cat > recorder.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const OUTPUT = "recording.json";

          let actions = [];

          function save() {
            fs.writeFileSync(
              OUTPUT,
              JSON.stringify(actions, null, 2)
            );
          }

          function record(action) {

            actions.push(action);

            console.log(
              "[RECORDER]",
              JSON.stringify(action)
            );

            save();
          }

          async function main() {

            console.log("");
            console.log("================================");
            console.log("🎥 RECORDER STARTING");
            console.log("================================");
            console.log("");

            const browser =
              await chromium.connectOverCDP(
                "http://127.0.0.1:9222"
              );

            console.log("✅ Connected to Chromium");
            console.log("");

            const contexts =
              browser.contexts();

            for (const context of contexts) {

              for (const page of context.pages()) {

                installRecorder(page);

              }

              context.on("page", page => {

                installRecorder(page);

              });

            }

            console.log("================================");
            console.log("🟢 RECORDER ACTIVE");
            console.log("================================");
            console.log("");
            console.log("👤 حالا وارد noVNC شو.");
            console.log("🖱️ کلیک‌ها ثبت می‌شوند.");
            console.log("⌨️ تایپ‌ها ثبت می‌شوند.");
            console.log("📜 اسکرول‌ها ثبت می‌شوند.");
            console.log("🌐 Navigation ثبت می‌شود.");
            console.log("⏱️ زمان ذخیره نمی‌شود.");
            console.log("");

            save();

            await new Promise(() => {});

          }

          async function installRecorder(page) {

            console.log(
              "📄 Recorder attached:",
              page.url()
            );

            await page.exposeFunction(
              "__recordAction",
              data => {

                record(data);

              }
            );

            await page.addInitScript(() => {

              function getSelector(el) {

                if (!el) {
                  return null;
                }

                if (el.id) {
                  return "#" + CSS.escape(el.id);
                }

                if (el.name) {
                  return (
                    el.tagName.toLowerCase() +
                    '[name="' +
                    CSS.escape(el.name) +
                    '"]'
                  );
                }

                if (el.getAttribute("data-testid")) {
                  return (
                    '[data-testid="' +
                    CSS.escape(
                      el.getAttribute("data-testid")
                    ) +
                    '"]'
                  );
                }

                return el.tagName.toLowerCase();

              }

              // ================================
              // CLICK
              // ================================

              document.addEventListener(
                "click",
                event => {

                  const el = event.target;

                  window.__recordAction({

                    type: "click",

                    selector:
                      getSelector(el),

                    x: event.clientX,

                    y: event.clientY

                  });

                },
                true
              );

              // ================================
              // INPUT / TYPE
              // ================================

              document.addEventListener(
                "input",
                event => {

                  const el = event.target;

                  if (!el) {
                    return;
                  }

                  if (
                    el instanceof HTMLInputElement ||
                    el instanceof HTMLTextAreaElement ||
                    el instanceof HTMLSelectElement
                  ) {

                    const password =
                      el.type === "password";

                    window.__recordAction({

                      type: "type",

                      selector:
                        getSelector(el),

                      value:
                        password
                          ? "******"
                          : el.value

                    });

                  }

                },
                true
              );

              // ================================
              // SCROLL
              // ================================

              let lastX = window.scrollX;
              let lastY = window.scrollY;

              window.addEventListener(
                "scroll",
                () => {

                  const x = window.scrollX;
                  const y = window.scrollY;

                  if (
                    Math.abs(x - lastX) < 50 &&
                    Math.abs(y - lastY) < 50
                  ) {
                    return;
                  }

                  lastX = x;
                  lastY = y;

                  window.__recordAction({

                    type: "scroll",

                    x,
                    y

                  });

                },
                {
                  passive: true
                }
              );

            });

            page.on(
              "framenavigated",
              frame => {

                if (
                  frame === page.mainFrame()
                ) {

                  record({

                    type: "navigation",

                    url: frame.url()

                  });

                }

              }
            );

          }

          main().catch(error => {

            console.error(error);

            process.exit(1);

          });

          EOF

      # ==================================================
      # 7. اجرای Recorder
      # ==================================================

      - name: Start Recorder
        run: |
          node recorder.js

      # ==================================================
      # 8. آپلود recording
      # ==================================================

      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording
          path: recording.json

      # ==================================================
      # 9. نگه داشتن Workflow
      # ==================================================

      - name: Keep Browser Alive
        if: always()
        run: |
          while true; do
            echo "🟢 Browser is running..."
            docker ps
            sleep 60
          done
