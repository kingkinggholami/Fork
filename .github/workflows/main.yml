name: اجرای مرورگر با noVNC + ضبط حرکات

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: اجرای کانتینر کروم با دیباگ
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -e CHROMIUM_OPTS="--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --no-sandbox" \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

      - name: نصب cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: نصب ابزارهای مورد نیاز و بررسی پورت دیباگ
        run: |
          echo "⏳ منتظر آماده شدن کانتینر..."
          sleep 20
          echo "🔍 بررسی پورت 9222..."
          # نصب net-tools داخل کانتینر
          docker exec chromium apk add --no-cache net-tools 2>/dev/null || true
          docker exec chromium netstat -tulpn | grep 9222 || echo "⚠️ پورت 9222 باز نیست!"
          docker exec chromium ps aux | grep chromium || echo "⚠️ فرآیند کروم پیدا نشد!"

      - name: نصب Node.js و puppeteer-core
        run: |
          npm init -y
          npm install puppeteer-core

      - name: ایجاد اسکریپت ضبط حرکات (با بازیابی خودکار)
        run: |
          cat > recorder.js << 'EOF'
          const puppeteer = require('puppeteer-core');

          async function connectWithRetry() {
            let attempts = 0;
            while (attempts < 30) {
              try {
                const browser = await puppeteer.connect({
                  browserURL: 'http://localhost:9222',
                  defaultViewport: null,
                });
                return browser;
              } catch (e) {
                attempts++;
                console.log(`⏳ در انتظار دیباگر (تلاش ${attempts}/۳۰)...`);
                await new Promise(r => setTimeout(r, 3000));
              }
            }
            throw new Error('امکان اتصال به دیباگر وجود ندارد');
          }

          (async () => {
            console.log('🔄 اتصال به دیباگر کروم...');
            const browser = await connectWithRetry();
            console.log('✅ اتصال برقرار شد');

            function setupPage(page) {
              page.evaluateOnNewDocument(() => {
                const logEvent = (type, data) => {
                  console.log(JSON.stringify({ type, data, time: Date.now() }));
                };
                document.addEventListener('click', (e) => {
                  logEvent('click', {
                    tag: e.target.tagName,
                    id: e.target.id || '',
                    class: e.target.className || '',
                    x: e.clientX,
                    y: e.clientY,
                    path: e.composedPath ? e.composedPath().slice(0, 5).map(el => el.tagName).join(' > ') : '',
                  });
                }, true);
                document.addEventListener('keydown', (e) => {
                  logEvent('keydown', {
                    key: e.key,
                    code: e.code,
                    target: e.target.tagName,
                    value: e.target.value || '',
                  });
                }, true);
                document.addEventListener('scroll', (e) => {
                  logEvent('scroll', {
                    target: e.target.tagName,
                    scrollTop: e.target.scrollTop || 0,
                    scrollLeft: e.target.scrollLeft || 0,
                    pageXOffset: window.pageXOffset || 0,
                    pageYOffset: window.pageYOffset || 0,
                  });
                }, true);
              });

              page.on('console', (msg) => {
                if (msg.type() === 'log') {
                  const text = msg.text();
                  try {
                    const event = JSON.parse(text);
                    console.log(`[${event.type}]`, JSON.stringify(event.data));
                  } catch (e) { /* ignore */ }
                }
              });
            }

            const pages = await browser.pages();
            for (const page of pages) await setupPage(page);

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const page = await target.page();
                if (page) await setupPage(page);
              }
            });

            console.log('🟢 ضبط‌کننده فعال است.');
            await new Promise(() => {});
          })();
          EOF

      - name: اجرای ضبط‌کننده و تونل
        run: |
          node recorder.js &
          RECORDER_PID=$!
          sleep 5

          cloudflared tunnel \
            --url http://localhost:5800 \
            --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARE_PID=$!

          sleep 10
          echo "===== آدرس دسترسی ====="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log || echo "⚠️ آدرس پیدا نشد"
          echo "======================="

          tail -f /tmp/cloudflared.log &
          while true; do
            echo "💚 سرویس‌ها فعال هستند..."
            docker ps
            sleep 60
          done
