name: Browser Recorder - noVNC

on:
  workflow_dispatch:
    inputs:
      website:
        description: "آدرس سایت"
        required: true
        type: string
        default: "https://example.com"

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. Start Chromium + noVNC
      # ==========================================================
      - name: Start Chromium
        shell: bash
        run: |
          set -e

          docker rm -f chromium 2>/dev/null || true
          docker rm -f cdp-proxy 2>/dev/null || true

          docker run -d \
            --name chromium \
            --restart unless-stopped \
            --shm-size=2g \
            -e VNC_PASSWORD=your_password \
            -e DISPLAY_WIDTH=1280 \
            -e DISPLAY_HEIGHT=720 \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

          echo "✅ Chromium started"

      # ==========================================================
      # 2. Wait for noVNC
      # ==========================================================
      - name: Wait for noVNC
        shell: bash
        run: |
          set -e

          echo "⏳ منتظر noVNC..."

          for i in {1..60}; do
            if curl -fsS \
              --max-time 5 \
              http://127.0.0.1:5800/ \
              >/dev/null 2>&1; then

              echo "✅ noVNC آماده است"
              exit 0
            fi

            echo "⏳ تلاش $i/60"
            sleep 2
          done

          echo "❌ noVNC آماده نشد"
          docker ps -a
          docker logs chromium || true
          exit 1

      # ==========================================================
      # 3. Inspect Chromium
      # ==========================================================
      - name: Inspect Chromium
        shell: bash
        run: |
          echo "========== DOCKER =========="
          docker ps -a
          echo "============================"

          echo ""
          echo "========== PROCESSES =========="
          docker exec chromium ps aux || true
          echo "==============================="

          echo ""
          echo "========== LOGS =========="
          docker logs --tail 200 chromium || true
          echo "=========================="

      # ==========================================================
      # 4. Wait for internal Chromium CDP
      # ==========================================================
      - name: Wait for internal CDP
        shell: bash
        run: |
          set -e

          echo "⏳ منتظر CDP داخلی Chromium..."

          for i in {1..90}; do

            if docker exec chromium \
              sh -c \
              'wget -qO- http://127.0.0.1:9223/json/version' \
              > /tmp/internal-cdp.json 2>/dev/null; then

              echo ""
              echo "✅ CDP داخلی آماده است"
              echo ""

              cat /tmp/internal-cdp.json

              exit 0
            fi

            echo "⏳ CDP داخلی هنوز آماده نیست... $i/90"
            sleep 2
          done

          echo ""
          echo "❌ CDP داخلی آماده نشد"

          echo ""
          echo "========== PROCESSES =========="
          docker exec chromium ps aux || true

          echo ""
          echo "========== LOGS =========="
          docker logs --tail 300 chromium || true

          exit 1

      # ==========================================================
      # 5. Create direct CDP proxy
      # ==========================================================
      - name: Create CDP proxy
        shell: bash
        run: |
          set -e

          echo "⏳ ایجاد proxy برای CDP..."

          docker run -d \
            --name cdp-proxy \
            --network container:chromium \
            alpine/socat \
            TCP-LISTEN:9224,fork,reuseaddr \
            TCP:127.0.0.1:9223

          echo "✅ CDP proxy created"

          sleep 2

      # ==========================================================
      # 6. Test CDP from runner
      # ==========================================================
      - name: Test CDP
        shell: bash
        run: |
          set -e

          echo "⏳ تست اتصال CDP..."

          # Since cdp-proxy shares Chromium network namespace,
          # use docker exec to verify the proxy itself.
          for i in {1..30}; do

            if docker exec chromium \
              sh -c \
              'wget -qO- http://127.0.0.1:9224/json/version' \
              > /tmp/cdp-proxy.json 2>/dev/null; then

              echo "✅ CDP proxy داخل namespace فعال است"
              cat /tmp/cdp-proxy.json

              exit 0
            fi

            sleep 2
          done

          echo "❌ CDP proxy تست نشد"

          docker logs chromium || true
          exit 1

      # ==========================================================
      # 7. Setup Node.js
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==========================================================
      # 8. Install Playwright
      # ==========================================================
      - name: Install Playwright
        shell: bash
        run: |
          set -e

          npm init -y
          npm install playwright

          echo "✅ Playwright installed"

      # ==========================================================
      # 9. Create Recorder
      # ==========================================================
      - name: Create Recorder
        shell: bash
        run: |
          cat > recorder.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const OUTPUT = "recording.json";
          const CDP_URL = "http://127.0.0.1:9222";

          let actions = [];

          // ------------------------------------------------------
          // Save without timestamp
          // ------------------------------------------------------
          function save() {
            fs.writeFileSync(
              OUTPUT,
              JSON.stringify(actions, null, 2),
              "utf8"
            );
          }

          // ------------------------------------------------------
          // Record action
          // ------------------------------------------------------
          function record(action) {
            actions.push(action);

            console.log(
              "[RECORDER]",
              JSON.stringify(action)
            );

            save();
          }

          // ------------------------------------------------------
          // Install recorder in page
          // ------------------------------------------------------
          async function installRecorder(page) {

            console.log(
              "📄 Installing recorder on:",
              page.url()
            );

            // ----------------------------------------------------
            // Expose click
            // ----------------------------------------------------
            try {
              await page.exposeFunction(
                "__recordClick",
                async data => {

                  record({
                    type: "click",
                    selector: data.selector,
                    x: data.x,
                    y: data.y
                  });

                }
              );
            } catch (_) {}

            // ----------------------------------------------------
            // Expose input
            // ----------------------------------------------------
            try {
              await page.exposeFunction(
                "__recordInput",
                async data => {

                  record({
                    type: "type",
                    selector: data.selector,
                    value:
                      data.password
                        ? "******"
                        : data.value
                  });

                }
              );
            } catch (_) {}

            // ----------------------------------------------------
            // Expose scroll
            // ----------------------------------------------------
            try {
              await page.exposeFunction(
                "__recordScroll",
                async data => {

                  record({
                    type: "scroll",
                    x: data.x,
                    y: data.y
                  });

                }
              );
            } catch (_) {}

            // ----------------------------------------------------
            // Inject into current document
            // ----------------------------------------------------
            async function inject() {

              try {

                await page.evaluate(() => {

                  if (
                    window.__BROWSER_RECORDER_INSTALLED
                  ) {
                    return;
                  }

                  window.__BROWSER_RECORDER_INSTALLED = true;

                  function selectorFor(el) {

                    if (!el) {
                      return null;
                    }

                    // ID
                    if (el.id) {
                      return "#" +
                        CSS.escape(el.id);
                    }

                    // data-testid
                    const testId =
                      el.getAttribute("data-testid");

                    if (testId) {
                      return `[data-testid="${CSS.escape(testId)}"]`;
                    }

                    // name
                    const name =
                      el.getAttribute("name");

                    if (name) {
                      return `${el.tagName.toLowerCase()}[name="${CSS.escape(name)}"]`;
                    }

                    // aria-label
                    const aria =
                      el.getAttribute("aria-label");

                    if (aria) {
                      return `${el.tagName.toLowerCase()}[aria-label="${CSS.escape(aria)}"]`;
                    }

                    // fallback
                    const parts = [];
                    let current = el;

                    while (
                      current &&
                      current.nodeType ===
                        Node.ELEMENT_NODE &&
                      parts.length < 6
                    ) {

                      let part =
                        current.tagName.toLowerCase();

                      if (
                        current.classList &&
                        current.classList.length
                      ) {

                        part += "." +
                          [...current.classList]
                            .slice(0, 2)
                            .map(x => CSS.escape(x))
                            .join(".");
                      }

                      const parent =
                        current.parentElement;

                      if (parent) {

                        const siblings =
                          [...parent.children]
                            .filter(
                              x =>
                                x.tagName ===
                                current.tagName
                            );

                        if (siblings.length > 1) {

                          part +=
                            `:nth-of-type(${siblings.indexOf(current) + 1})`;
                        }
                      }

                      parts.unshift(part);

                      current =
                        current.parentElement;
                    }

                    return parts.join(" > ");
                  }

                  // ------------------------------------------------
                  // CLICK
                  // ------------------------------------------------
                  document.addEventListener(
                    "click",
                    event => {

                      let element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      if (
                        element instanceof SVGElement
                      ) {

                        element =
                          element.closest(
                            "button, a, input, textarea, select, [role='button']"
                          ) || element;
                      }

                      window.__recordClick({
                        selector:
                          selectorFor(element),

                        x:
                          event.clientX,

                        y:
                          event.clientY
                      }).catch(() => {});

                    },
                    true
                  );

                  // ------------------------------------------------
                  // INPUT
                  // ------------------------------------------------
                  document.addEventListener(
                    "input",
                    event => {

                      const element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      if (
                        element instanceof
                          HTMLInputElement ||
                        element instanceof
                          HTMLTextAreaElement ||
                        element instanceof
                          HTMLSelectElement
                      ) {

                        window.__recordInput({

                          selector:
                            selectorFor(element),

                          value:
                            element.value,

                          password:
                            element instanceof
                              HTMLInputElement &&
                            element.type ===
                              "password"

                        }).catch(() => {});
                      }

                    },
                    true
                  );

                  // ------------------------------------------------
                  // SCROLL
                  // ------------------------------------------------
                  let lastX =
                    window.scrollX;

                  let lastY =
                    window.scrollY;

                  let scrollTimer = null;

                  window.addEventListener(
                    "scroll",
                    () => {

                      clearTimeout(scrollTimer);

                      scrollTimer =
                        setTimeout(() => {

                          const x =
                            window.scrollX;

                          const y =
                            window.scrollY;

                          if (
                            Math.abs(x - lastX) < 50 &&
                            Math.abs(y - lastY) < 50
                          ) {
                            return;
                          }

                          lastX = x;
                          lastY = y;

                          window.__recordScroll({
                            x,
                            y
                          }).catch(() => {});

                        }, 150);

                    },
                    {
                      passive: true
                    }
                  );

                  console.log(
                    "🟢 Recorder injected"
                  );

                });

              } catch (error) {

                console.log(
                  "⚠️ Injection failed:",
                  error.message
                );

              }
            }

            await inject();

            // ------------------------------------------------------
            // Re-inject after navigation
            // ------------------------------------------------------
            page.on(
              "framenavigated",
              async frame => {

                if (
                  frame !== page.mainFrame()
                ) {
                  return;
                }

                const url =
                  frame.url();

                record({
                  type: "navigation",
                  url
                });

                await page
                  .waitForLoadState(
                    "domcontentloaded"
                  )
                  .catch(() => {});

                await inject();
              }
            );
          }

          // ------------------------------------------------------
          // Main
          // ------------------------------------------------------
          async function main() {

            console.log("");
            console.log(
              "===================================="
            );
            console.log(
              "🎥 BROWSER RECORDER"
            );
            console.log(
              "===================================="
            );
            console.log("");

            save();

            console.log(
              "⏳ Connecting to Chromium..."
            );

            const browser =
              await chromium.connectOverCDP(
                CDP_URL
              );

            console.log(
              "✅ Connected to Chromium"
            );

            const contexts =
              browser.contexts();

            console.log(
              `📦 Contexts: ${contexts.length}`
            );

            for (
              const context of contexts
            ) {

              const pages =
                context.pages();

              console.log(
                `📄 Pages: ${pages.length}`
              );

              for (
                const page of pages
              ) {

                await installRecorder(page);

              }

              context.on(
                "page",
                async page => {

                  console.log(
                    "🆕 New tab/page:",
                    page.url()
                  );

                  await page
                    .waitForLoadState(
                      "domcontentloaded"
                    )
                    .catch(() => {});

                  await installRecorder(page);

                }
              );
            }

            console.log("");
            console.log(
              "===================================="
            );
            console.log(
              "🟢 RECORDER ACTIVE"
            );
            console.log(
              "===================================="
            );
            console.log("");
            console.log(
              "🖱️ Click: ON"
            );
            console.log(
              "⌨️ Type: ON"
            );
            console.log(
              "📜 Scroll: ON"
            );
            console.log(
              "🌐 Navigation: ON"
            );
            console.log(
              "⏱️ Timestamp: OFF"
            );
            console.log(
              "🔐 Password values: HIDDEN"
            );
            console.log("");
            console.log(
              "👤 وارد noVNC شو و شروع کن."
            );
            console.log("");

            process.on(
              "SIGINT",
              () => {
                save();
                process.exit(0);
              }
            );

            process.on(
              "SIGTERM",
              () => {
                save();
                process.exit(0);
              }
            );

            await new Promise(
              () => {}
            );
          }

          main().catch(error => {

            console.error(
              "❌ Recorder error:"
            );

            console.error(error);

            save();

            process.exit(1);
          });
          EOF

          echo "✅ recorder.js created"

      # ==========================================================
      # 10. Open Website AND start Recorder together
      # ==========================================================
      - name: Start Browser and Recorder
        shell: bash
        env:
          WEBSITE_INPUT: ${{ inputs.website }}
        run: |
          set -e

          WEBSITE="$WEBSITE_INPUT"

          if [[ \
            "$WEBSITE" != http://* &&
            "$WEBSITE" != https://*
          ]]; then
            WEBSITE="https://$WEBSITE"
          fi

          export WEBSITE

          echo "=========================================="
          echo "🌐 Website"
          echo "=========================================="
          echo "$WEBSITE"
          echo ""

          echo "=========================================="
          echo "⏳ Opening website..."
          echo "=========================================="

          node <<'EOF' &
          const { chromium } = require("playwright");

          (async () => {

            const browser =
              await chromium.connectOverCDP(
                process.env.CDP_URL
              );

            const context =
              browser.contexts()[0];

            if (!context) {
              throw new Error(
                "No browser context"
              );
            }

            let pages =
              context.pages();

            let page =
              pages[0];

            if (!page) {
              page =
                await context.newPage();
            }

            console.log(
              "🌐 Opening:",
              process.env.WEBSITE
            );

            await page.goto(
              process.env.WEBSITE,
              {
                waitUntil: "domcontentloaded",
                timeout: 60000
              }
            ).catch(error => {

              console.log(
                "⚠️ Navigation warning:",
                error.message
              );

            });

            console.log(
              "✅ Current URL:",
              page.url()
            );

          })().catch(error => {

            console.error(
              "❌ Open website error:",
              error
            );

          });
          EOF

          echo $! > /tmp/open-site.pid

          sleep 3

          echo ""
          echo "=========================================="
          echo "🎥 STARTING RECORDER"
          echo "=========================================="
          echo ""

          node recorder.js
        env:
          CDP_URL: http://127.0.0.1:9222

      # ==========================================================
      # 11. Install Cloudflared
      # ==========================================================
      - name: Install Cloudflared
        if: always()
        run: |
          set -e

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ==========================================================
      # 12. Start Cloudflare Tunnel
      # ==========================================================
      - name: Start Cloudflare Tunnel
        if: always()
        run: |
          set -e

          cloudflared tunnel \
            --url http://127.0.0.1:5800 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          echo "⏳ منتظر Cloudflare URL..."

          TUNNEL_URL=""

          for i in {1..60}; do

            TUNNEL_URL=$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                | head -n 1 \
                || true
            )

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2

          done

          echo ""
          echo "=========================================="
          echo "🌐 NO VNC URL"
          echo "=========================================="
          echo "$TUNNEL_URL"
          echo "=========================================="
          echo ""
          echo "🔐 Password: your_password"
          echo ""

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Cloudflare URL پیدا نشد"
            cat /tmp/cloudflared.log || true
            exit 1
          fi

      # ==========================================================
      # 13. Upload Recording
      # ==========================================================
      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording
          path: recording.json
          if-no-files-found: warn

      # ==========================================================
      # 14. Upload Debug Logs
      # ==========================================================
      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug-logs
          path: |
            /tmp/cloudflared.log
            /tmp/cdp-version.json
            /tmp/internal-cdp.json
          if-no-files-found: warn

      # ==========================================================
      # 15. Cleanup
      # ==========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "🧹 Cleaning up..."

          if [ -f /tmp/open-site.pid ]; then
            kill \
              "$(cat /tmp/open-site.pid)" \
              2>/dev/null || true
          fi

          if [ -f /tmp/cloudflared.pid ]; then
            kill \
              "$(cat /tmp/cloudflared.pid)" \
              2>/dev/null || true
          fi

          docker rm -f cdp-proxy \
            2>/dev/null || true

          docker rm -f chromium \
            2>/dev/null || true

          echo "✅ Cleanup completed"
