name: 运行 Chromium 浏览器 (noVNC + 远程调试)

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 启动 Chromium 容器 (启用远程调试)
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -e CHROMIUM_REMOTE_DEBUGGING=1 \
            -e CHROMIUM_REMOTE_DEBUGGING_PORT=9222 \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

      - name: 安装 cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: 安装 Puppeteer
        run: |
          npm init -y
          npm install puppeteer-core

      - name: 创建录制脚本
        run: |
          cat > recorder.js << 'EOF'
          const puppeteer = require('puppeteer-core');

          async function connectWithRetry() {
            let attempts = 0;
            while (attempts < 30) {
              try {
                const browser = await puppeteer.connect({
                  browserURL: 'http://localhost:9222',
                  defaultViewport: null,
                });
                return browser;
              } catch (e) {
                attempts++;
                console.log(`⏳ 等待调试器准备就绪 (尝试 ${attempts}/30)...`);
                await new Promise(r => setTimeout(r, 2000));
              }
            }
            throw new Error('无法连接到 Chromium 调试器');
          }

          (async () => {
            console.log('🔄 正在连接 Chromium 调试器...');
            const browser = await connectWithRetry();
            console.log('✅ 连接成功！');

            function setupPage(page) {
              page.evaluateOnNewDocument(() => {
                const logEvent = (type, data) => {
                  console.log(JSON.stringify({ type, data, time: Date.now() }));
                };

                document.addEventListener('click', (e) => {
                  logEvent('click', {
                    tag: e.target.tagName,
                    id: e.target.id || '',
                    class: e.target.className || '',
                    x: e.clientX,
                    y: e.clientY,
                  });
                }, true);

                document.addEventListener('keydown', (e) => {
                  logEvent('keydown', {
                    key: e.key,
                    code: e.code,
                    target: e.target.tagName,
                    value: e.target.value || '',
                  });
                }, true);

                document.addEventListener('scroll', (e) => {
                  logEvent('scroll', {
                    target: e.target.tagName,
                    scrollTop: e.target.scrollTop || 0,
                    scrollLeft: e.target.scrollLeft || 0,
                    pageXOffset: window.pageXOffset || 0,
                    pageYOffset: window.pageYOffset || 0,
                  });
                }, true);
              });

              page.on('console', (msg) => {
                if (msg.type() === 'log') {
                  const text = msg.text();
                  try {
                    const event = JSON.parse(text);
                    console.log(`[${event.type}]`, JSON.stringify(event.data));
                  } catch (e) {}
                }
              });
            }

            const pages = await browser.pages();
            for (const page of pages) {
              await setupPage(page);
            }

            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const page = await target.page();
                if (page) {
                  await setupPage(page);
                }
              }
            });

            console.log('🟢 录制器已启动，所有操作将被记录。');
            await new Promise(() => {});
          })();
          EOF

      - name: 运行录制器和 Cloudflare Tunnel
        run: |
          echo "⏳ 等待 Chromium 启动..."
          sleep 15

          node recorder.js &
          RECORDER_PID=$!

          sleep 10

          cloudflared tunnel \
            --url http://localhost:5800 \
            --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARE_PID=$!

          sleep 10

          echo "===== Cloudflare 访问地址 ====="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log || echo "⚠️ 未找到地址，请检查日志"
          echo "================================"

          while true; do
            echo "🟢 所有服务运行中..."
            docker ps
            sleep 60
          done
