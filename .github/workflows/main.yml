
name: Browser Recorder - noVNC

on:
  workflow_dispatch:
    inputs:
      website:
        description: "آدرس سایت"
        required: true
        type: string
        default: "https://example.com"

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==================================================
      # 1. Start Chromium + noVNC + CDP
      # ==================================================
      - name: Start Chromium
        shell: bash
        run: |
          set -e

          docker rm -f chromium 2>/dev/null || true

          docker run -d \
            --name chromium \
            --shm-size=2g \
            -e VNC_PASSWORD=your_password \
            -e DISPLAY_WIDTH=1280 \
            -e DISPLAY_HEIGHT=720 \
            -e CHROMIUM_REMOTE_DEBUGGING=1 \
            -e CHROMIUM_REMOTE_DEBUGGING_PORT=9222 \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

          echo "Chromium container started."

      # ==================================================
      # 2. Wait for noVNC
      # ==================================================
      - name: Wait for noVNC
        shell: bash
        run: |
          set -e

          echo "⏳ منتظر noVNC..."

          for i in {1..60}; do
            if curl -fsS \
              --max-time 5 \
              http://127.0.0.1:5800/ \
              >/dev/null 2>&1; then

              echo "✅ noVNC آماده است"
              exit 0
            fi

            echo "⏳ noVNC هنوز آماده نیست... $i/60"
            sleep 2
          done

          echo "❌ noVNC در زمان مشخص آماده نشد"

          echo "========== DOCKER =========="
          docker ps -a || true
          echo "============================"

          echo "========== CHROMIUM LOGS =========="
          docker logs chromium || true
          echo "==================================="

          exit 1

      # ==================================================
      # 3. Wait for Chromium CDP
      # ==================================================
      - name: Wait for Chrome DevTools Protocol
        shell: bash
        run: |
          set -e

          echo "⏳ منتظر Chrome DevTools Protocol..."

          for i in {1..90}; do

            # First check the externally exposed CDP endpoint.
            if curl -fsS \
              --max-time 5 \
              http://127.0.0.1:9222/json/version \
              > /tmp/cdp-version.json 2>/dev/null; then

              echo ""
              echo "======================================"
              echo "✅ Chrome DevTools Protocol آماده است"
              echo "======================================"
              cat /tmp/cdp-version.json
              echo ""

              exit 0
            fi

            # Also inspect the internal Chromium/proxy state.
            if (( i % 5 == 0 )); then
              echo ""
              echo "---------- CDP DEBUG $i/90 ----------"

              echo "Host port 9222:"
              curl -v \
                --max-time 3 \
                http://127.0.0.1:9222/json/version \
                2>&1 || true

              echo ""
              echo "Container processes:"
              docker exec chromium sh -c \
                'ps aux | grep -E "chromium|remote_debugging|socat" | grep -v grep || true' \
                2>&1 || true

              echo ""
              echo "Container listening ports:"
              docker exec chromium sh -c \
                'ss -lntp 2>/dev/null | grep -E "9222|9223|5800|5900" || true' \
                2>&1 || true

              echo "-------------------------------------"
              echo ""
            fi

            echo "⏳ CDP هنوز آماده نیست... $i/90"
            sleep 2
          done

          echo ""
          echo "❌ CDP در 180 ثانیه آماده نشد"
          echo ""

          echo "========== DOCKER =========="
          docker ps -a
          echo "============================"

          echo ""
          echo "========== CHROMIUM LOGS =========="
          docker logs chromium || true
          echo "==================================="

          exit 1

      # ==================================================
      # 4. Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ==================================================
      # 5. Install Playwright
      # ==================================================
      - name: Install Playwright
        shell: bash
        run: |
          set -e

          npm init -y
          npm install playwright

      # ==================================================
      # 6. Create Browser Recorder
      # ==================================================
      - name: Create Recorder
        shell: bash
        run: |
          cat > recorder.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const OUTPUT = "recording.json";

          const WEBSITE = process.env.WEBSITE;

          let actions = [];

          // =================================================
          // Save recording
          // =================================================

          function save() {
            try {
              fs.writeFileSync(
                OUTPUT,
                JSON.stringify(actions, null, 2)
              );
            } catch (error) {
              console.error(
                "❌ Cannot save recording:",
                error
              );
            }
          }

          // =================================================
          // Add action
          // =================================================

          function addAction(action) {
            actions.push(action);

            console.log(
              "[RECORDER]",
              JSON.stringify(action)
            );

            save();
          }

          // =================================================
          // Install recorder
          // =================================================

          async function installRecorder(page) {

            console.log(
              "📄 Recorder attached:",
              page.url()
            );

            // ---------------------------------------------
            // Exposed functions
            // ---------------------------------------------

            try {
              await page.exposeFunction(
                "__recordClick",
                async data => {
                  addAction({
                    type: "click",
                    selector: data.selector,
                    x: data.x,
                    y: data.y
                  });
                }
              );
            } catch (_) {}

            try {
              await page.exposeFunction(
                "__recordInput",
                async data => {

                  let value = data.value;

                  if (data.password) {
                    value = "******";
                  }

                  addAction({
                    type: "type",
                    selector: data.selector,
                    value
                  });
                }
              );
            } catch (_) {}

            try {
              await page.exposeFunction(
                "__recordScroll",
                async data => {
                  addAction({
                    type: "scroll",
                    x: data.x,
                    y: data.y
                  });
                }
              );
            } catch (_) {}

            // ---------------------------------------------
            // Inject into current document
            // ---------------------------------------------

            async function inject() {

              try {

                await page.evaluate(() => {

                  if (
                    window.__BROWSER_RECORDER_INSTALLED
                  ) {
                    return;
                  }

                  window.__BROWSER_RECORDER_INSTALLED = true;

                  // ========================================
                  // Selector generator
                  // ========================================

                  function selectorFor(el) {

                    if (!el) {
                      return null;
                    }

                    if (el.id) {
                      return "#" +
                        CSS.escape(el.id);
                    }

                    const testId =
                      el.getAttribute("data-testid");

                    if (testId) {
                      return `[data-testid="${CSS.escape(testId)}"]`;
                    }

                    const name =
                      el.getAttribute("name");

                    if (name) {
                      return `${el.tagName.toLowerCase()}[name="${CSS.escape(name)}"]`;
                    }

                    const aria =
                      el.getAttribute("aria-label");

                    if (aria) {
                      return `${el.tagName.toLowerCase()}[aria-label="${CSS.escape(aria)}"]`;
                    }

                    let current = el;
                    const parts = [];

                    while (
                      current &&
                      current.nodeType === Node.ELEMENT_NODE &&
                      parts.length < 5
                    ) {

                      let part =
                        current.tagName.toLowerCase();

                      if (
                        current.classList &&
                        current.classList.length
                      ) {

                        const classes =
                          [...current.classList]
                            .slice(0, 2)
                            .map(x => CSS.escape(x))
                            .join(".");

                        if (classes) {
                          part += "." + classes;
                        }
                      }

                      const parent =
                        current.parentElement;

                      if (parent) {

                        const siblings =
                          [...parent.children]
                            .filter(
                              x =>
                                x.tagName ===
                                current.tagName
                            );

                        if (siblings.length > 1) {

                          const index =
                            siblings.indexOf(current) + 1;

                          part +=
                            `:nth-of-type(${index})`;
                        }
                      }

                      parts.unshift(part);

                      current =
                        current.parentElement;
                    }

                    return parts.join(" > ");
                  }

                  // ========================================
                  // CLICK
                  // ========================================

                  document.addEventListener(
                    "click",
                    async event => {

                      let element =
                        event.target;

                      if (
                        element &&
                        element.nodeType !==
                        Node.ELEMENT_NODE
                      ) {
                        element =
                          element.parentElement;
                      }

                      if (!element) {
                        return;
                      }

                      const selector =
                        selectorFor(element);

                      try {

                        await window.__recordClick({
                          selector,
                          x: event.clientX,
                          y: event.clientY
                        });

                      } catch (error) {

                        console.error(
                          "Recorder click error:",
                          error
                        );
                      }

                    },
                    true
                  );

                  // ========================================
                  // INPUT
                  // ========================================

                  document.addEventListener(
                    "input",
                    async event => {

                      const element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      if (
                        element instanceof HTMLInputElement ||
                        element instanceof HTMLTextAreaElement ||
                        element instanceof HTMLSelectElement
                      ) {

                        const selector =
                          selectorFor(element);

                        try {

                          await window.__recordInput({

                            selector,

                            value:
                              element.value,

                            password:
                              element instanceof
                              HTMLInputElement &&
                              element.type ===
                              "password"

                          });

                        } catch (error) {

                          console.error(
                            "Recorder input error:",
                            error
                          );
                        }
                      }

                    },
                    true
                  );

                  // ========================================
                  // SCROLL
                  // ========================================

                  let lastX =
                    window.scrollX;

                  let lastY =
                    window.scrollY;

                  let scrollTimer = null;

                  window.addEventListener(
                    "scroll",
                    () => {

                      clearTimeout(
                        scrollTimer
                      );

                      scrollTimer =
                        setTimeout(
                          async () => {

                            const x =
                              window.scrollX;

                            const y =
                              window.scrollY;

                            if (
                              Math.abs(
                                x - lastX
                              ) < 50 &&
                              Math.abs(
                                y - lastY
                              ) < 50
                            ) {
                              return;
                            }

                            lastX = x;
                            lastY = y;

                            try {

                              await window.__recordScroll({
                                x,
                                y
                              });

                            } catch (error) {

                              console.error(
                                "Recorder scroll error:",
                                error
                              );
                            }

                          },
                          150
                        );

                    },
                    {
                      passive: true
                    }
                  );

                  console.log(
                    "🟢 Browser Recorder injected"
                  );
                });

              } catch (error) {

                console.log(
                  "⚠️ Could not inject recorder:",
                  error.message
                );
              }
            }

            await inject();

            // ---------------------------------------------
            // Re-inject after navigation
            // ---------------------------------------------

            page.on(
              "framenavigated",
              async frame => {

                if (
                  frame !== page.mainFrame()
                ) {
                  return;
                }

                const url =
                  frame.url();

                console.log(
                  "[RECORDER] Navigation:",
                  url
                );

                addAction({
                  type: "navigation",
                  url
                });

                await page
                  .waitForLoadState(
                    "domcontentloaded"
                  )
                  .catch(() => {});

                await inject();
              }
            );
          }

          // =================================================
          // Main
          // =================================================

          async function main() {

            console.log("");
            console.log(
              "===================================="
            );
            console.log(
              "🎥 BROWSER RECORDER STARTING"
            );
            console.log(
              "===================================="
            );
            console.log("");

            save();

            if (!WEBSITE) {
              throw new Error(
                "WEBSITE environment variable is missing"
              );
            }

            // ---------------------------------------------
            // Connect to CDP
            // ---------------------------------------------

            let browser = null;

            for (
              let i = 1;
              i <= 30;
              i++
            ) {

              try {

                console.log(
                  `⏳ Connecting to CDP... ${i}/30`
                );

                browser =
                  await chromium.connectOverCDP(
                    "http://127.0.0.1:9222"
                  );

                console.log(
                  "✅ Connected to Chromium"
                );

                break;

              } catch (error) {

                console.log(
                  "⚠️ CDP connection failed:",
                  error.message
                );

                if (i === 30) {
                  throw error;
                }

                await new Promise(
                  resolve =>
                    setTimeout(
                      resolve,
                      2000
                    )
                );
              }
            }

            // ---------------------------------------------
            // Get context
            // ---------------------------------------------

            const contexts =
              browser.contexts();

            console.log(
              `📦 Contexts: ${contexts.length}`
            );

            if (!contexts.length) {
              throw new Error(
                "Chromium has no browser context"
              );
            }

            const context =
              contexts[0];

            // ---------------------------------------------
            // Existing pages
            // ---------------------------------------------

            let pages =
              context.pages();

            console.log(
              `📄 Existing pages: ${pages.length}`
            );

            let page =
              pages[0];

            // ---------------------------------------------
            // Create page if needed
            // ---------------------------------------------

            if (!page) {

              page =
                await context.newPage();

            }

            // ---------------------------------------------
            // Install recorder
            // ---------------------------------------------

            await installRecorder(page);

            // ---------------------------------------------
            // New pages / tabs
            // ---------------------------------------------

            context.on(
              "page",
              async newPage => {

                console.log(
                  "🆕 New page:",
                  newPage.url()
                );

                try {
                  await installRecorder(
                    newPage
                  );
                } catch (error) {
                  console.error(
                    "❌ Failed to install recorder:",
                    error
                  );
                }
              }
            );

            // ---------------------------------------------
            // Open requested website
            // ---------------------------------------------

            console.log("");
            console.log(
              "🌐 Opening website:"
            );
            console.log(
              WEBSITE
            );
            console.log("");

            await page.goto(
              WEBSITE,
              {
                waitUntil: "domcontentloaded",
                timeout: 60000
              }
            ).catch(error => {

              console.log(
                "⚠️ Initial navigation:",
                error.message
              );

            });

            await injectRecorderSafely(
              page
            );

            console.log("");
            console.log(
              "===================================="
            );
            console.log(
              "🟢 RECORDER ACTIVE"
            );
            console.log(
              "===================================="
            );
            console.log("");

            console.log(
              "🖱️ کلیک‌ها ثبت می‌شوند"
            );

            console.log(
              "⌨️ تایپ‌ها ثبت می‌شوند"
            );

            console.log(
              "📜 اسکرول‌ها ثبت می‌شوند"
            );

            console.log(
              "🌐 Navigation ثبت می‌شود"
            );

            console.log(
              "🔐 مقدار password ذخیره نمی‌شود"
            );

            console.log("");
            console.log(
              "🌐 حالا وارد noVNC شو و کارهایت را انجام بده."
            );
            console.log("");

            // ---------------------------------------------
            // Graceful shutdown
            // ---------------------------------------------

            const shutdown =
              () => {

                console.log("");
                console.log(
                  "🛑 Stopping recorder..."
                );

                save();

                console.log(
                  `💾 ${actions.length} actions saved.`
                );

                process.exit(0);
              };

            process.on(
              "SIGINT",
              shutdown
            );

            process.on(
              "SIGTERM",
              shutdown
            );

            // Keep process alive.
            await new Promise(
              () => {}
            );
          }

          // =================================================
          // Helper
          // =================================================

          async function injectRecorderSafely(page) {
            try {
              await page.evaluate(() => {
                // Recorder is already installed by
                // installRecorder(). This function only
                // verifies the page is alive.
                return true;
              });
            } catch (_) {}
          }

          main().catch(
            error => {

              console.error("");
              console.error(
                "❌ RECORDER ERROR"
              );

              console.error(error);

              save();

              process.exit(1);
            }
          );
          EOF

      # ==================================================
      # 7. Open Website + Start Recorder
      # ==================================================
      - name: Start Recorder
        shell: bash
        env:
          WEBSITE: ${{ inputs.website }}
        run: |
          set -e

          WEBSITE_VALUE="$WEBSITE"

          if [[ \
            "$WEBSITE_VALUE" != http://* &&
            "$WEBSITE_VALUE" != https://*
          ]]; then
            WEBSITE_VALUE="https://$WEBSITE_VALUE"
          fi

          export WEBSITE="$WEBSITE_VALUE"

          echo "=========================================="
          echo "🎥 STARTING BROWSER RECORDER"
          echo "=========================================="

          echo ""
          echo "🌐 Website:"
          echo "$WEBSITE"

          echo ""
          echo "🌐 noVNC:"
          echo "${TUNNEL_URL:-not-started-yet}"

          echo ""
          echo "🔐 Password:"
          echo "your_password"

          echo ""
          echo "=========================================="
          echo "🟢 Recorder is starting..."
          echo "=========================================="
          echo ""

          node recorder.js

      # ==================================================
      # 8. Install Cloudflared
      # ==================================================
      - name: Install Cloudflared
        if: always()
        shell: bash
        run: |
          set -e

          echo "⏳ نصب cloudflared..."

          if command -v cloudflared >/dev/null 2>&1; then
            cloudflared --version
            exit 0
          fi

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ==================================================
      # 9. Start Cloudflare Tunnel
      # ==================================================
      - name: Start Cloudflare Tunnel
        if: always()
        shell: bash
        run: |
          set -e

          echo "⏳ شروع Cloudflare Tunnel..."

          cloudflared tunnel \
            --url http://127.0.0.1:5800 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" \
            > /tmp/cloudflared.pid

          echo "⏳ منتظر URL..."

          TUNNEL_URL=""

          for i in {1..60}; do

            TUNNEL_URL=$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                | head -n 1 \
                || true
            )

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            echo "⏳ هنوز URL ساخته نشده... $i/60"

            sleep 2

          done

          echo ""
          echo "=========================================="
          echo "🌐 NO VNC URL"
          echo "=========================================="
          echo "$TUNNEL_URL"
          echo "=========================================="
          echo ""

          echo "🔐 VNC Password: your_password"
          echo ""

          if [ -z "$TUNNEL_URL" ]; then

            echo "❌ Cloudflare Tunnel URL پیدا نشد"

            echo ""
            cat /tmp/cloudflared.log || true

            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" \
            >> "$GITHUB_ENV"

      # ==================================================
      # 10. Upload Recording
      # ==================================================
      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording
          path: recording.json
          if-no-files-found: warn

      # ==================================================
      # 11. Upload Debug Logs
      # ==================================================
      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug-logs
          path: |
            /tmp/cloudflared.log
            /tmp/cdp-version.json
          if-no-files-found: warn

      # ==================================================
      # 12. Final Chromium Diagnostics
      # ==================================================
      - name: Final Chromium Diagnostics
        if: always()
        shell: bash
        run: |
          echo "========== FINAL DOCKER =========="
          docker ps -a || true
          echo "=================================="

          echo ""
          echo "========== FINAL CHROMIUM LOGS =========="
          docker logs chromium || true
          echo "========================================="

          echo ""
          echo "========== FINAL CDP =========="

          curl -fsS \
            --max-time 5 \
            http://127.0.0.1:9222/json/version \
            || true

          echo ""
          echo "==============================="

          echo ""
          echo "========== CLOUDFLARED =========="

          cat /tmp/cloudflared.log \
            2>/dev/null || true

          echo "================================="
