name: اجرای مرورگر با noVNC + ضبط حرکات (X11)

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: اجرای کانتینر کروم
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -p 5800:5800 \
            -p 5900:5900 \
            jlesage/chromium:latest

      - name: نصب cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: نصب ابزارهای ضبط X11 در کانتینر
        run: |
          docker exec chromium apk add --no-cache xinput xdotool util-linux

      - name: اجرای اسکریپت ضبط رویدادهای X11
        run: |
          docker exec -d chromium sh -c "
            # ایجاد فایل لاگ
            touch /tmp/events.log
            chmod 666 /tmp/events.log

            # تابعی برای ثبت زمان و نوع رویداد
            log_event() {
              echo \"[\$(date -Iseconds)] \$1\" >> /tmp/events.log
            }

            # ضبط کلیک‌ها با xinput
            xinput test-xi2 --root 2>&1 | while read line; do
              case \"\$line\" in
                *\"ButtonPress\"*)
                  echo \"[CLICK] \$line\" >> /tmp/events.log
                  ;;
                *\"KeyPress\"*)
                  echo \"[KEY] \$line\" >> /tmp/events.log
                  ;;
                *\"Motion\"*)
                  # برای کاهش حجم، فقط هر ۵۰ میلی‌ثانیه یک بار ذخیره شود
                  # (اختیاری) می‌توانید کامنت کنید تا همه حرکات ماوس ثبت شود
                  # echo \"[MOVE] \$line\" >> /tmp/events.log
                  ;;
              esac
            done &
            XINPUT_PID=\$!

            # ضبط اسکرول با xdotool (تشخیص چرخش ماوس)
            while true; do
              # دریافت موقعیت اسکرول با استفاده از xdotool getmouselocation
              # اما اسکرول رویداد خاصی دارد که با xinput هم قابل دریافت است
              # برای سادگی، از xinput برای اسکرول هم استفاده میکنیم
              sleep 1
            done

            wait \$XINPUT_PID
          "

          echo "✅ اسکریپت ضبط X11 در کانتینر اجرا شد."

      - name: اجرای تونل Cloudflare و نمایش لاگ‌ها
        run: |
          cloudflared tunnel \
            --url http://localhost:5800 \
            --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARE_PID=$!

          sleep 15

          echo "===== آدرس دسترسی به مرورگر ====="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log
          echo "================================="

          echo "🟢 تونل فعال است. لاگ رویدادها در حال جمع‌آوری..."

          # نمایش لاگ رویدادها در خروجی (و همچنین لاگ تونل)
          while true; do
            echo "📋 آخرین رویدادهای ثبت‌شده:"
            docker exec chromium tail -n 5 /tmp/events.log 2>/dev/null || echo "(هنوز رویدادی ثبت نشده)"
            echo "----------------------------------------"
            sleep 30
          done

      - name: آپلود لاگ‌ها پس از پایان (اختیاری)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            /tmp/cloudflared.log
            /tmp/events.log
          retention-days: 7
