name: اجرای مرورگر با noVNC (Cloudflare Tunnel) + ضبط حرکات

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: اجرای کانتینر کروم با قابلیت دیباگ از راه دور
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -e CHROMIUM_OPTS="--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

      - name: نصب cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: نصب Node.js و puppeteer-core
        run: |
          npm init -y
          npm install puppeteer-core

      - name: ایجاد اسکریپت ضبط حرکات
        run: |
          cat > recorder.js << 'EOF'
          const puppeteer = require('puppeteer-core');

          async function connectWithRetry() {
            let attempts = 0;
            while (attempts < 30) {
              try {
                const browser = await puppeteer.connect({
                  browserURL: 'http://localhost:9222',
                  defaultViewport: null,
                });
                return browser;
              } catch (e) {
                attempts++;
                console.log(`⏳ در انتظار آماده‌سازی دیباگر کروم (تلاش ${attempts}/۳۰)...`);
                await new Promise(r => setTimeout(r, 2000));
              }
            }
            throw new Error('امکان اتصال به دیباگر کروم وجود ندارد');
          }

          (async () => {
            console.log('🔄 اتصال به دیباگر کروم...');
            const browser = await connectWithRetry();
            console.log('✅ اتصال برقرار شد');

            function setupPage(page) {
              // تزریق اسکریپت ضبط به هر صفحه جدید
              page.evaluateOnNewDocument(() => {
                const logEvent = (type, data) => {
                  console.log(JSON.stringify({ type, data, time: Date.now() }));
                };

                // ثبت کلیک
                document.addEventListener('click', (e) => {
                  logEvent('click', {
                    tag: e.target.tagName,
                    id: e.target.id || '',
                    class: e.target.className || '',
                    x: e.clientX,
                    y: e.clientY,
                    path: e.composedPath ? e.composedPath().slice(0, 5).map(el => el.tagName).join(' > ') : '',
                  });
                }, true);

                // ثبت فشردن کلید
                document.addEventListener('keydown', (e) => {
                  logEvent('keydown', {
                    key: e.key,
                    code: e.code,
                    target: e.target.tagName,
                    value: e.target.value || '',
                  });
                }, true);

                // ثبت اسکرول
                document.addEventListener('scroll', (e) => {
                  logEvent('scroll', {
                    target: e.target.tagName,
                    scrollTop: e.target.scrollTop || 0,
                    scrollLeft: e.target.scrollLeft || 0,
                    pageXOffset: window.pageXOffset || 0,
                    pageYOffset: window.pageYOffset || 0,
                  });
                }, true);
              });

              // شنود کنسول صفحات برای دریافت لاگ‌ها
              page.on('console', (msg) => {
                if (msg.type() === 'log') {
                  const text = msg.text();
                  try {
                    const event = JSON.parse(text);
                    console.log(`[${event.type}]`, JSON.stringify(event.data));
                  } catch (e) {
                    // لاگ‌های غیر JSON نادیده گرفته می‌شوند
                  }
                }
              });
            }

            // اعمال روی صفحات موجود
            const pages = await browser.pages();
            for (const page of pages) {
              await setupPage(page);
            }

            // اعمال روی صفحات جدید
            browser.on('targetcreated', async (target) => {
              if (target.type() === 'page') {
                const page = await target.page();
                if (page) {
                  await setupPage(page);
                }
              }
            });

            console.log('🟢 ضبط‌کننده فعال است. تمام حرکات شما در مرورگر ثبت خواهد شد.');
            // نگه‌داری اسکریپت
            await new Promise(() => {});
          })();
          EOF

      - name: اجرای ضبط‌کننده و تونل Cloudflare
        run: |
          echo "⏳ منتظر آماده شدن کروم..."
          sleep 15

          # اجرای اسکریپت ضبط در پس‌زمینه
          node recorder.js &
          RECORDER_PID=$!

          # صبر برای اتصال ضبط‌کننده
          sleep 10

          echo "✅ ضبط‌کننده راه‌اندازی شد."

          # اجرای تونل Cloudflare
          cloudflared tunnel \
            --url http://localhost:5800 \
            --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARE_PID=$!

          sleep 10

          echo "===== آدرس دسترسی به مرورگر ====="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log || echo "⚠️ آدرس پیدا نشد، بعداً دوباره تلاش کنید"
          echo "================================="

          # نمایش لاگ‌های تونل در پس‌زمینه (اختیاری)
          tail -f /tmp/cloudflared.log &

          echo "🟢 همه سرویس‌ها فعال هستند. می‌توانید از آدرس بالا به مرورگر متصل شوید."
          echo "🟢 تمام کلیک‌ها، تایپ‌ها و اسکرول‌ها در لاگ‌های این مرحله ثبت می‌شوند."

          # حلقه نگه‌داری تا پایان زمان
          while true; do
            echo "💚 مرورگر و تونل و ضبط‌کننده در حال اجرا..."
            docker ps
            sleep 60
          done
