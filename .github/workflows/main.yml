name: Screenshot

on:
  workflow_dispatch:
    inputs:
      url:
        description: "آدرس سایت مورد نظر"
        required: true
        default: "google.com"

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install playwright pillow
          playwright install chromium
          playwright install-deps chromium

      - name: Run
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright
          from PIL import ImageDraw, Image

          url = "${{ github.event.inputs.url }}"
          if not url.startswith("http"):
              url = "https://" + url

          X, Y = 700, 635

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_context(viewport={"width": 1280, "height": 800}).new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(3000)

              page.mouse.move(X, Y)
              page.mouse.down()
              page.mouse.up()
              page.evaluate(f"document.elementFromPoint({X}, {Y})?.click()")
              page.wait_for_timeout(2000)

              page.screenshot(path="raw.png")
              browser.close()

          # رسم نقطه قرمز روی مختصات
          img = Image.open("raw.png")
          draw = ImageDraw.Draw(img)
          r = 10  # شعاع نقطه
          draw.ellipse([X - r, Y - r, X + r, Y + r], fill="red", outline="white", width=2)
          img.save("screenshot.png")
          print(f"✅ نقطه قرمز روی {X}, {Y} رسم شد")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
