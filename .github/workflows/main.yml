name: Browser Recorder - noVNC

on:
  workflow_dispatch:
    inputs:
      website:
        description: "آدرس سایت"
        required: true
        type: string
        default: "https://example.com"

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==================================================
      # Chromium + noVNC
      # ==================================================

      - name: Start Chromium
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -e ENABLE_CDP=1 \
            -e CDP_PORT=9222 \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

      # ==================================================
      # Wait for noVNC
      # ==================================================

      - name: Wait for noVNC
        run: |
          echo "⏳ منتظر noVNC..."

          for i in {1..60}; do
            if curl -fs http://127.0.0.1:5800 > /dev/null 2>&1; then
              echo "✅ noVNC آماده است"
              break
            fi

            echo "⏳ تلاش $i/60"
            sleep 2
          done

          echo ""
          echo "========== DOCKER =========="
          docker ps
          echo "============================"

      # ==================================================
      # Debug Chromium
      # ==================================================

      - name: Chromium logs
        run: |
          echo "========== CHROMIUM LOGS =========="
          docker logs --tail 200 chromium || true
          echo "==================================="

      # ==================================================
      # Wait for CDP
      # ==================================================

      - name: Wait for CDP
        run: |
          echo "⏳ منتظر Chrome DevTools Protocol..."

          for i in {1..90}; do

            if curl -fs \
              http://127.0.0.1:9222/json/version \
              > /tmp/cdp.json 2>/dev/null
            then

              echo ""
              echo "================================"
              echo "✅ CDP آماده است"
              echo "================================"
              cat /tmp/cdp.json
              echo ""

              exit 0
            fi

            echo "⏳ CDP هنوز آماده نیست... $i/90"

            sleep 2
          done

          echo ""
          echo "❌ CDP بعد از 180 ثانیه آماده نشد."
          echo ""

          echo "========== PORT 9222 =========="
          curl -v http://127.0.0.1:9222/json/version || true
          echo "==============================="

          echo ""
          echo "========== CHROMIUM LOGS =========="
          docker logs --tail 300 chromium || true
          echo "==================================="

          exit 1

      # ==================================================
      # Node
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==================================================
      # Playwright
      # ==================================================

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      # ==================================================
      # Create Recorder
      # ==================================================

      - name: Create Recorder
        run: |

          cat > recorder.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const OUTPUT = "recording.json";

          let actions = [];

          function save() {
            fs.writeFileSync(
              OUTPUT,
              JSON.stringify(actions, null, 2)
            );
          }

          function record(action) {

            actions.push(action);

            console.log(
              "[RECORDER]",
              JSON.stringify(action)
            );

            save();
          }

          async function installRecorder(page) {

            console.log(
              "📄 Recorder attached:",
              page.url()
            );

            await page.exposeFunction(
              "__recordAction",
              data => {

                record(data);

              }
            );

            await page.addInitScript(() => {

              function selector(el) {

                if (!el) {
                  return null;
                }

                if (el.id) {
                  return "#" + CSS.escape(el.id);
                }

                if (el.name) {

                  return (
                    el.tagName.toLowerCase() +
                    '[name="' +
                    CSS.escape(el.name) +
                    '"]'
                  );

                }

                if (el.getAttribute("data-testid")) {

                  return (
                    '[data-testid="' +
                    CSS.escape(
                      el.getAttribute("data-testid")
                    ) +
                    '"]'
                  );

                }

                return el.tagName.toLowerCase();

              }

              // ------------------------------------------
              // CLICK
              // ------------------------------------------

              document.addEventListener(
                "click",
                event => {

                  const el = event.target;

                  window.__recordAction({

                    type: "click",

                    selector: selector(el),

                    x: event.clientX,

                    y: event.clientY

                  });

                },
                true
              );

              // ------------------------------------------
              // TYPE
              // ------------------------------------------

              document.addEventListener(
                "input",
                event => {

                  const el = event.target;

                  if (!el) {
                    return;
                  }

                  if (
                    el instanceof HTMLInputElement ||
                    el instanceof HTMLTextAreaElement ||
                    el instanceof HTMLSelectElement
                  ) {

                    const isPassword =
                      el.type === "password";

                    window.__recordAction({

                      type: "type",

                      selector: selector(el),

                      value:
                        isPassword
                          ? "******"
                          : el.value

                    });

                  }

                },
                true
              );

              // ------------------------------------------
              // SCROLL
              // ------------------------------------------

              let lastX = window.scrollX;
              let lastY = window.scrollY;

              window.addEventListener(
                "scroll",
                () => {

                  const x = window.scrollX;
                  const y = window.scrollY;

                  if (
                    Math.abs(x - lastX) < 50 &&
                    Math.abs(y - lastY) < 50
                  ) {
                    return;
                  }

                  lastX = x;
                  lastY = y;

                  window.__recordAction({

                    type: "scroll",

                    x,
                    y

                  });

                },
                {
                  passive: true
                }
              );

            });

            // ------------------------------------------
            // NAVIGATION
            // ------------------------------------------

            page.on(
              "framenavigated",
              frame => {

                if (
                  frame === page.mainFrame()
                ) {

                  record({

                    type: "navigation",

                    url: frame.url()

                  });

                }

              }
            );

          }

          async function main() {

            console.log("");
            console.log("================================");
            console.log("🎥 RECORDER STARTING");
            console.log("================================");

            const browser =
              await chromium.connectOverCDP(
                "http://127.0.0.1:9222"
              );

            console.log(
              "✅ Connected to Chromium"
            );

            const contexts =
              browser.contexts();

            for (const context of contexts) {

              for (const page of context.pages()) {

                await installRecorder(page);

              }

              context.on(
                "page",
                async page => {

                  await installRecorder(page);

                }
              );

            }

            save();

            console.log("");
            console.log("================================");
            console.log("🟢 RECORDER ACTIVE");
            console.log("================================");
            console.log("");
            console.log("🖱️ Click = ثبت می‌شود");
            console.log("⌨️ Type = ثبت می‌شود");
            console.log("📜 Scroll = ثبت می‌شود");
            console.log("🌐 Navigation = ثبت می‌شود");
            console.log("⏱️ Timestamp = ذخیره نمی‌شود");
            console.log("");
            console.log("👤 حالا وارد noVNC شو و شروع کن.");
            console.log("");

            // زنده نگه داشتن Recorder

            await new Promise(
              () => {}
            );

          }

          main().catch(error => {

            console.error(
              "❌ Recorder error:",
              error
            );

            process.exit(1);

          });

          EOF

      # ==================================================
      # Start Recorder in background
      # ==================================================

      - name: Start Recorder
        run: |
          node recorder.js > recorder.log 2>&1 &

          echo $! > recorder.pid

          sleep 3

          echo ""
          echo "========== RECORDER =========="
          cat recorder.log
          echo "=============================="

      # ==================================================
      # Cloudflare
      # ==================================================

      - name: Install cloudflared
        run: |
          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Tunnel
        run: |

          cloudflared tunnel \
            --url http://127.0.0.1:5800 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          sleep 10

          echo ""
          echo "========================================"
          echo "🌐 NO-VNC URL"
          echo "========================================"

          grep -o \
            'https://[-a-zA-Z0-9]*\.trycloudflare\.com' \
            /tmp/cloudflared.log \
            | head -1 || true

          echo "========================================"
          echo ""

      # ==================================================
      # Keep alive
      # ==================================================

      - name: Keep Browser Alive
        run: |

          echo "🟢 مرورگر فعال است."
          echo "🟢 Recorder فعال است."
          echo "🟢 وارد لینک Cloudflare شو."

          while true; do

            echo ""
            echo "========== RECORDER LOG =========="

            if [ -f recorder.log ]; then
              tail -30 recorder.log
            fi

            echo "=================================="

            docker ps

            sleep 30

          done

      # ==================================================
      # Upload recording
      # ==================================================

      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording
          path: |
            recording.json
            recorder.log
