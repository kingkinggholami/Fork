name: Browser Recorder - noVNC

on:
  workflow_dispatch:
    inputs:
      website:
        description: "آدرس سایت"
        required: true
        type: string
        default: "https://example.com"

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. Start Chromium + noVNC
      # ==========================================================
      - name: Start Chromium
        shell: bash
        run: |
          set -e

          docker rm -f chromium 2>/dev/null || true

          docker pull jlesage/chromium:latest

          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASSWORD=your_password \
            -e DISPLAY_WIDTH=1280 \
            -e DISPLAY_HEIGHT=720 \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

          echo "Chromium container started"

      # ==========================================================
      # 2. Wait for noVNC
      # ==========================================================
      - name: Wait for noVNC
        shell: bash
        run: |
          set -e

          echo "⏳ منتظر noVNC..."

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5800/ >/dev/null 2>&1; then
              echo "✅ noVNC آماده است"
              exit 0
            fi

            echo "⏳ noVNC هنوز آماده نیست... $i/60"
            sleep 2
          done

          echo "❌ noVNC آماده نشد"

          docker ps -a
          docker logs chromium || true

          exit 1

      # ==========================================================
      # 3. Inspect Chromium
      # ==========================================================
      - name: Inspect Chromium
        shell: bash
        run: |
          echo "========== docker ps =========="
          docker ps -a

          echo ""
          echo "========== processes =========="
          docker exec chromium ps aux || true

          echo ""
          echo "========== listening =========="
          docker exec chromium sh -c \
            "netstat -lntp 2>/dev/null || ss -lntp 2>/dev/null || true"

          echo ""
          echo "========== chromium logs =========="
          docker logs chromium || true

      # ==========================================================
      # 4. Find working CDP endpoint
      # ==========================================================
      - name: Wait for CDP
        shell: bash
        run: |
          set -e

          echo "⏳ پیدا کردن Chrome DevTools Protocol..."

          for i in {1..90}; do

            echo ""
            echo "========== CDP CHECK $i/90 =========="

            # First try host 9222
            if curl -fsS \
              --max-time 3 \
              http://127.0.0.1:9222/json/version \
              > /tmp/cdp-version.json 2>/dev/null; then

              echo "✅ CDP روی host:9222 فعال است"
              cat /tmp/cdp-version.json

              echo "CDP_URL=http://127.0.0.1:9222" >> "$GITHUB_ENV"

              exit 0
            fi

            # Then try from inside container on 9223
            if docker exec chromium sh -c \
              "wget -qO- http://127.0.0.1:9223/json/version" \
              > /tmp/cdp-version.json 2>/dev/null; then

              echo "✅ CDP داخل container روی 9223 فعال است"
              cat /tmp/cdp-version.json

              # Make a direct host tunnel to the actual Chromium CDP port.
              docker run -d \
                --name cdp-proxy \
                --network container:chromium \
                alpine/socat \
                TCP-LISTEN:9222,fork,reuseaddr \
                TCP:127.0.0.1:9223

              sleep 1

              if curl -fsS \
                --max-time 3 \
                http://127.0.0.1:9222/json/version \
                > /tmp/cdp-version.json 2>/dev/null; then

                echo "✅ CDP proxy فعال شد"
                cat /tmp/cdp-version.json

                echo "CDP_URL=http://127.0.0.1:9222" >> "$GITHUB_ENV"

                exit 0
              fi
            fi

            echo "❌ CDP هنوز آماده نیست"

            if [ "$i" -eq 10 ] || [ "$i" -eq 30 ] || [ "$i" -eq 60 ] || [ "$i" -eq 90 ]; then
              echo ""
              echo "========== DEBUG =========="

              docker exec chromium ps aux || true

              docker exec chromium sh -c \
                "wget -qO- http://127.0.0.1:9223/json/version || true"

              docker logs --tail 100 chromium || true

              echo "============================"
            fi

            sleep 2
          done

          echo "❌ CDP در زمان مشخص آماده نشد"

          docker ps -a
          docker logs chromium || true

          exit 1

      # ==========================================================
      # 5. Setup Node
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==========================================================
      # 6. Install Playwright
      # ==========================================================
      - name: Install Playwright
        shell: bash
        run: |
          set -e

          npm init -y
          npm install playwright

          node -e "console.log('Playwright installed')"

      # ==========================================================
      # 7. Test Playwright CDP
      # ==========================================================
      - name: Test Playwright CDP
        shell: bash
        run: |
          set -e

          node <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            console.log("CDP URL:", process.env.CDP_URL);

            const browser = await chromium.connectOverCDP(
              process.env.CDP_URL
            );

            console.log("✅ Playwright connected to Chromium");

            const contexts = browser.contexts();

            console.log("Contexts:", contexts.length);

            for (const context of contexts) {
              console.log("Pages:", context.pages().length);

              for (const page of context.pages()) {
                console.log("Page:", page.url());
              }
            }

            await browser.close();
          })().catch(err => {
            console.error("❌ Playwright CDP test failed");
            console.error(err);
            process.exit(1);
          });
          EOF

      # ==========================================================
      # 8. Open Website
      # ==========================================================
      - name: Open Website
        shell: bash
        env:
          WEBSITE_INPUT: ${{ inputs.website }}
        run: |
          set -e

          WEBSITE="$WEBSITE_INPUT"

          if [[ "$WEBSITE" != http://* && "$WEBSITE" != https://* ]]; then
            WEBSITE="https://$WEBSITE"
          fi

          echo "🌐 Website: $WEBSITE"

          node <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.connectOverCDP(
              process.env.CDP_URL
            );

            const context =
              browser.contexts()[0] ||
              await browser.newContext();

            let pages = context.pages();

            let page = pages[0];

            if (!page) {
              page = await context.newPage();
            }

            console.log("🌐 Opening:", process.env.WEBSITE);

            await page.goto(
              process.env.WEBSITE,
              {
                waitUntil: "domcontentloaded",
                timeout: 60000
              }
            ).catch(err => {
              console.log(
                "⚠️ Navigation warning:",
                err.message
              );
            });

            console.log("Current URL:", page.url());

            // Keep browser alive.
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF
        env:
          WEBSITE: ${{ inputs.website }}

      # ==========================================================
      # 9. Install Cloudflared
      # ==========================================================
      - name: Install Cloudflared
        shell: bash
        run: |
          set -e

          echo "⏳ نصب cloudflared..."

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ==========================================================
      # 10. Start Cloudflare Tunnel
      # ==========================================================
      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -e

          echo "⏳ شروع Cloudflare Tunnel..."

          cloudflared tunnel \
            --url http://127.0.0.1:5800 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          TUNNEL_URL=""

          for i in {1..60}; do

            TUNNEL_URL=$(
              grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | head -n 1 || true
            )

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            echo "⏳ منتظر URL تونل... $i/60"

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Cloudflare Tunnel URL پیدا نشد"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "🌐 NO VNC URL"
          echo "=========================================="
          echo "$TUNNEL_URL"
          echo "=========================================="
          echo ""
          echo "🔐 VNC Password: your_password"
          echo ""

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

      # ==========================================================
      # 11. Create Recorder
      # ==========================================================
      - name: Create Recorder
        shell: bash
        run: |
          cat > recorder.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const OUTPUT = "recording.json";

          let actions = [];

          // =====================================================
          // Save
          // =====================================================

          function save() {
            try {
              fs.writeFileSync(
                OUTPUT,
                JSON.stringify(actions, null, 2),
                "utf8"
              );
            } catch (err) {
              console.error(
                "❌ Cannot save recording:",
                err.message
              );
            }
          }

          // =====================================================
          // Add action
          // =====================================================

          function addAction(action) {
            actions.push({
              ...action,
              timestamp: Date.now()
            });

            console.log(
              "[RECORDER]",
              JSON.stringify(action)
            );

            save();
          }

          // =====================================================
          // Install recorder
          // =====================================================

          async function installRecorder(page) {

            console.log(
              "📄 Installing recorder:",
              page.url()
            );

            // ---------------------------------------------------
            // Click callback
            // ---------------------------------------------------

            try {
              await page.exposeFunction(
                "__recordClick",
                async data => {

                  addAction({
                    type: "click",
                    selector: data.selector,
                    x: data.x,
                    y: data.y
                  });

                }
              );
            } catch (_) {}

            // ---------------------------------------------------
            // Input callback
            // ---------------------------------------------------

            try {
              await page.exposeFunction(
                "__recordInput",
                async data => {

                  let value = data.value;

                  if (data.password) {
                    value = "******";
                  }

                  addAction({
                    type: "type",
                    selector: data.selector,
                    value
                  });

                }
              );
            } catch (_) {}

            // ---------------------------------------------------
            // Scroll callback
            // ---------------------------------------------------

            try {
              await page.exposeFunction(
                "__recordScroll",
                async data => {

                  addAction({
                    type: "scroll",
                    x: data.x,
                    y: data.y
                  });

                }
              );
            } catch (_) {}

            // ---------------------------------------------------
            // Navigation callback
            // ---------------------------------------------------

            async function inject() {

              try {

                await page.evaluate(() => {

                  if (
                    window.__BROWSER_RECORDER_INSTALLED
                  ) {
                    return;
                  }

                  window.__BROWSER_RECORDER_INSTALLED =
                    true;

                  // =============================================
                  // Selector generator
                  // =============================================

                  function selectorFor(el) {

                    if (!el) {
                      return null;
                    }

                    if (el.id) {
                      return "#" +
                        CSS.escape(el.id);
                    }

                    const testId =
                      el.getAttribute("data-testid");

                    if (testId) {
                      return `[data-testid="${CSS.escape(testId)}"]`;
                    }

                    const name =
                      el.getAttribute("name");

                    if (name) {
                      return `${el.tagName.toLowerCase()}[name="${CSS.escape(name)}"]`;
                    }

                    const aria =
                      el.getAttribute("aria-label");

                    if (aria) {
                      return `${el.tagName.toLowerCase()}[aria-label="${CSS.escape(aria)}"]`;
                    }

                    let current = el;
                    const parts = [];

                    while (
                      current &&
                      current.nodeType ===
                        Node.ELEMENT_NODE &&
                      parts.length < 6
                    ) {

                      let part =
                        current.tagName.toLowerCase();

                      if (
                        current.classList &&
                        current.classList.length
                      ) {

                        const classes =
                          [...current.classList]
                            .slice(0, 2)
                            .map(x =>
                              CSS.escape(x)
                            )
                            .join(".");

                        if (classes) {
                          part += "." + classes;
                        }
                      }

                      const parent =
                        current.parentElement;

                      if (parent) {

                        const siblings =
                          [...parent.children]
                            .filter(
                              x =>
                                x.tagName ===
                                current.tagName
                            );

                        if (siblings.length > 1) {

                          part +=
                            `:nth-of-type(${siblings.indexOf(current) + 1})`;
                        }
                      }

                      parts.unshift(part);

                      current =
                        current.parentElement;
                    }

                    return parts.join(" > ");
                  }

                  // =============================================
                  // CLICK
                  // =============================================

                  document.addEventListener(
                    "click",
                    event => {

                      const element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      const selector =
                        selectorFor(element);

                      window.__recordClick({
                        selector,
                        x: event.clientX,
                        y: event.clientY
                      }).catch(() => {});

                    },
                    true
                  );

                  // =============================================
                  // INPUT
                  // =============================================

                  document.addEventListener(
                    "input",
                    event => {

                      const element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      if (
                        element instanceof
                          HTMLInputElement ||
                        element instanceof
                          HTMLTextAreaElement ||
                        element instanceof
                          HTMLSelectElement
                      ) {

                        const selector =
                          selectorFor(element);

                        window.__recordInput({

                          selector,

                          value:
                            element.value,

                          password:
                            element instanceof
                              HTMLInputElement &&
                            element.type ===
                              "password"

                        }).catch(() => {});
                      }

                    },
                    true
                  );

                  // =============================================
                  // SCROLL
                  // =============================================

                  let lastX =
                    window.scrollX;

                  let lastY =
                    window.scrollY;

                  let scrollTimer = null;

                  window.addEventListener(
                    "scroll",
                    () => {

                      clearTimeout(
                        scrollTimer
                      );

                      scrollTimer =
                        setTimeout(() => {

                          const x =
                            window.scrollX;

                          const y =
                            window.scrollY;

                          if (
                            Math.abs(x - lastX) < 50 &&
                            Math.abs(y - lastY) < 50
                          ) {
                            return;
                          }

                          lastX = x;
                          lastY = y;

                          window.__recordScroll({
                            x,
                            y
                          }).catch(() => {});

                        }, 150);

                    },
                    {
                      passive: true
                    }
                  );

                  console.log(
                    "🟢 Browser Recorder injected"
                  );

                });

              } catch (err) {

                console.log(
                  "⚠️ Injection failed:",
                  err.message
                );
              }
            }

            await inject();

            // ---------------------------------------------------
            // Navigation
            // ---------------------------------------------------

            page.on(
              "framenavigated",
              async frame => {

                if (
                  frame !== page.mainFrame()
                ) {
                  return;
                }

                const url =
                  frame.url();

                console.log(
                  "[RECORDER] Navigation:",
                  url
                );

                addAction({
                  type: "navigation",
                  url
                });

                await page
                  .waitForLoadState(
                    "domcontentloaded"
                  )
                  .catch(() => {});

                await inject();
              }
            );
          }

          // =====================================================
          // Main
          // =====================================================

          async function main() {

            console.log("");
            console.log(
              "======================================"
            );
            console.log(
              "🎥 BROWSER RECORDER STARTING"
            );
            console.log(
              "======================================"
            );
            console.log("");

            // Create immediately
            save();

            console.log(
              "📁 Recording file:",
              OUTPUT
            );

            // ---------------------------------------------------
            // Connect
            // ---------------------------------------------------

            let browser = null;

            for (let i = 1; i <= 30; i++) {

              try {

                console.log(
                  `⏳ Connecting to CDP ${i}/30`
                );

                browser =
                  await chromium.connectOverCDP(
                    process.env.CDP_URL
                  );

                console.log(
                  "✅ Connected to Chromium"
                );

                break;

              } catch (err) {

                console.log(
                  "⚠️ CDP connection failed:",
                  err.message
                );

                if (i === 30) {
                  throw err;
                }

                await new Promise(
                  r => setTimeout(r, 2000)
                );
              }
            }

            // ---------------------------------------------------
            // Contexts
            // ---------------------------------------------------

            const contexts =
              browser.contexts();

            console.log(
              `📦 Contexts: ${contexts.length}`
            );

            for (const context of contexts) {

              const pages =
                context.pages();

              console.log(
                `📄 Existing pages: ${pages.length}`
              );

              for (const page of pages) {
                await installRecorder(page);
              }

              context.on(
                "page",
                async page => {

                  console.log(
                    "🆕 New page:",
                    page.url()
                  );

                  await installRecorder(page);

                }
              );
            }

            console.log("");
            console.log(
              "======================================"
            );
            console.log(
              "🟢 RECORDER ACTIVE"
            );
            console.log(
              "======================================"
            );
            console.log("");

            console.log(
              "🖱️ Click recording: ON"
            );

            console.log(
              "⌨️ Input recording: ON"
            );

            console.log(
              "📜 Scroll recording: ON"
            );

            console.log(
              "🌐 Navigation recording: ON"
            );

            console.log("");
            console.log(
              "🌐 وارد noVNC شو و کارهایت را انجام بده."
            );
            console.log("");

            // ---------------------------------------------------
            // Keep process alive
            // ---------------------------------------------------

            const shutdown = () => {

              console.log(
                "🛑 Stopping recorder..."
              );

              save();

              console.log(
                `💾 ${actions.length} actions saved`
              );

              process.exit(0);
            };

            process.on(
              "SIGINT",
              shutdown
            );

            process.on(
              "SIGTERM",
              shutdown
            );

            await new Promise(
              () => {}
            );
          }

          main().catch(err => {

            console.error(
              "❌ RECORDER ERROR"
            );

            console.error(err);

            save();

            process.exit(1);

          });

          EOF

      # ==========================================================
      # 12. Start Recorder
      # ==========================================================
      - name: Start Recorder
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "🎥 STARTING BROWSER RECORDER"
          echo "=========================================="

          echo ""
          echo "🌐 noVNC URL:"
          echo "$TUNNEL_URL"

          echo ""
          echo "🔐 Password:"
          echo "your_password"

          echo ""
          echo "=========================================="
          echo "🟢 RECORDER ACTIVE"
          echo "=========================================="
          echo ""

          node recorder.js

      # ==========================================================
      # 13. Upload recording
      # ==========================================================
      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording
          path: recording.json
          if-no-files-found: warn

      # ==========================================================
      # 14. Upload logs
      # ==========================================================
      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug-logs
          path: |
            /tmp/cloudflared.log
            /tmp/cdp-version.json
          if-no-files-found: warn

      # ==========================================================
      # 15. Cleanup
      # ==========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "🧹 Cleaning up..."

          docker rm -f cdp-proxy 2>/dev/null || true
          docker rm -f chromium 2>/dev/null || true

          echo "✅ Cleanup completed"
