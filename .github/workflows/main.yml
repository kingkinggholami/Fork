name: اجرای مرورگر با noVNC + ضبط حرکات (X11)

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: اجرای کانتینر کروم
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -p 5800:5800 \
            -p 5900:5900 \
            jlesage/chromium:latest

      - name: نصب cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: نصب ابزارهای ضبط X11 در کانتینر
        run: |
          docker exec chromium apk add --no-cache xinput xdotool util-linux

      - name: اجرای اسکریپت ضبط رویدادهای X11 (با نمایش لاگ زنده)
        run: |
          # ایجاد اسکریپت ضبط داخل کانتینر
          docker exec chromium sh -c "
            cat > /tmp/record.sh << 'SCRIPT'
            #!/bin/sh
            echo '⏳ شروع ضبط رویدادهای X11...' > /tmp/events.log
            echo '🖥️  نمایش دستگاه‌های ورودی:' >> /tmp/events.log
            xinput list >> /tmp/events.log 2>&1

            # ضبط رویدادها با xinput و نوشتن در فایل + خروجی استاندارد
            xinput test-xi2 --root 2>&1 | while read line; do
              # فیلتر رویدادهای مهم (کلیک، کلید، اسکرول)
              case \"\$line\" in
                *ButtonPress*|*ButtonRelease*|*KeyPress*|*KeyRelease*)
                  echo \"[\$(date -Iseconds)] X11: \$line\" | tee -a /tmp/events.log
                  ;;
                *Motion*)
                  # برای کاهش حجم، فقط هر 100 میلی‌ثانیه یکبار ضبط شود (اختیاری)
                  # echo \"[\$(date -Iseconds)] X11: \$line\" | tee -a /tmp/events.log
                  ;;
              esac
            done
            SCRIPT
            chmod +x /tmp/record.sh
          "

          # اجرای اسکریپت در پس‌زمینه با خروجی به کنسول (برای دیدن در لاگ Actions)
          docker exec -d chromium sh -c "/tmp/record.sh > /proc/1/fd/1 2>&1"

          echo "✅ اسکریپت ضبط X11 با موفقیت در کانتینر اجرا شد."

      - name: اجرای تونل Cloudflare و نمایش زنده لاگ رویدادها
        run: |
          cloudflared tunnel \
            --url http://localhost:5800 \
            --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARE_PID=$!

          sleep 15

          echo "===== آدرس دسترسی به مرورگر ====="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log
          echo "================================="
          echo "🟢 تونل فعال است. منتظر رویدادها..."

          # نمایش مداوم لاگ رویدادها (هر ۵ ثانیه یکبار)
          while true; do
            echo "📋 آخرین رویدادهای ثبت‌شده (از /tmp/events.log):"
            docker exec chromium tail -n 10 /tmp/events.log 2>/dev/null || echo "(هنوز رویدادی ثبت نشده)"
            echo "----------------------------------------"
            sleep 5
          done

      - name: آپلود لاگ‌ها پس از پایان (اختیاری)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            /tmp/cloudflared.log
            /tmp/events.log
          retention-days: 7
