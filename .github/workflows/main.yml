name: Browser Recorder - noVNC

on:
  workflow_dispatch:
    inputs:
      website:
        description: "آدرس سایت"
        required: true
        type: string
        default: "https://example.com"

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==================================================
      # 1. Start Chromium + noVNC + CDP
      # ==================================================
      - name: Start Chromium
        run: |
          set -e

          echo "🚀 Starting Chromium container..."

          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASSWORD=your_password \
            -e DISPLAY_WIDTH=1280 \
            -e DISPLAY_HEIGHT=720 \
            -p 5800:5800 \
            -p 9223:9223 \
            jlesage/chromium:latest

          echo "✅ Chromium container started"

      # ==================================================
      # 2. Show container status
      # ==================================================
      - name: Check Chromium container
        run: |
          echo "========== DOCKER =========="
          docker ps
          echo "============================"

          echo ""
          echo "========== CHROMIUM LOGS =========="
          docker logs chromium || true
          echo "==================================="

          echo ""
          echo "========== PORTS =========="
          docker port chromium || true
          echo "==========================="

      # ==================================================
      # 3. Wait for noVNC
      # ==================================================
      - name: Wait for noVNC
        run: |
          set -e

          echo "⏳ منتظر noVNC..."

          for i in {1..60}; do

            if curl -fsS \
              http://127.0.0.1:5800/ \
              > /dev/null 2>&1; then

              echo "✅ noVNC آماده است"
              exit 0
            fi

            echo "⏳ noVNC هنوز آماده نیست... $i/60"

            sleep 2

          done

          echo ""
          echo "❌ noVNC در زمان مشخص آماده نشد"

          docker ps || true
          docker logs chromium || true

          exit 1

      # ==================================================
      # 4. Wait for Chrome DevTools Protocol
      # ==================================================
      - name: Wait for Chrome DevTools Protocol
        run: |
          set -e

          echo "⏳ منتظر Chrome DevTools Protocol..."

          for i in {1..90}; do

            if curl -fsS \
              http://127.0.0.1:9223/json/version \
              > /tmp/cdp-version.json 2>/dev/null; then

              echo ""
              echo "======================================"
              echo "✅ Chrome DevTools Protocol آماده است"
              echo "======================================"

              cat /tmp/cdp-version.json

              exit 0
            fi

            if [ "$i" -eq 1 ] || \
               [ "$i" -eq 10 ] || \
               [ "$i" -eq 30 ] || \
               [ "$i" -eq 60 ]; then

              echo ""
              echo "---------- CDP DEBUG $i/90 ----------"

              echo ""
              echo "Host :9223:"
              curl -v \
                http://127.0.0.1:9223/json/version \
                2>&1 || true

              echo ""
              echo "Container :9223:"

              docker exec chromium \
                sh -c \
                'wget -qO- http://127.0.0.1:9223/json/version' \
                || true

              echo ""
              echo "Container processes:"

              docker exec chromium \
                ps aux \
                || true

              echo ""
              echo "Container ports:"

              docker port chromium \
                || true

              echo ""
              echo "-------------------------------------"
            fi

            echo "⏳ CDP هنوز آماده نیست... $i/90"

            sleep 2

          done

          echo ""
          echo "❌ CDP در 180 ثانیه آماده نشد"
          echo ""

          echo "========== DOCKER =========="
          docker ps
          echo "============================"

          echo ""
          echo "========== DOCKER PORTS =========="
          docker port chromium || true
          echo "==================================="

          echo ""
          echo "========== CHROMIUM LOGS =========="
          docker logs chromium || true
          echo "==================================="

          exit 1

      # ==================================================
      # 5. Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==================================================
      # 6. Install Playwright
      # ==================================================
      - name: Install Playwright
        run: |
          set -e

          npm init -y

          npm install playwright

          echo ""
          echo "✅ Playwright installed"

          node -e "console.log(require('playwright/package.json').version)"

      # ==================================================
      # 7. Create Browser Recorder
      # ==================================================
      - name: Create Recorder
        run: |
          cat > recorder.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const OUTPUT = "recording.json";

          let actions = [];

          // ==================================================
          // Save recording
          // ==================================================

          function save() {
            try {
              fs.writeFileSync(
                OUTPUT,
                JSON.stringify(actions, null, 2)
              );
            } catch (error) {
              console.error(
                "❌ Cannot save recording:",
                error
              );
            }
          }

          // ==================================================
          // Add action
          // ==================================================

          function addAction(action) {

            actions.push({
              ...action,
              timestamp: Date.now()
            });

            console.log(
              "[RECORDER]",
              JSON.stringify(action)
            );

            save();
          }

          // ==================================================
          // Install recorder into page
          // ==================================================

          async function installRecorder(page) {

            console.log(
              "📄 Recorder attached:",
              page.url()
            );

            // --------------------------------------------------
            // Expose click
            // --------------------------------------------------

            try {

              await page.exposeFunction(
                "__recordClick",
                async data => {

                  addAction({
                    type: "click",
                    selector: data.selector,
                    x: data.x,
                    y: data.y
                  });

                }
              );

            } catch (error) {
              // Already exposed
            }

            // --------------------------------------------------
            // Expose input
            // --------------------------------------------------

            try {

              await page.exposeFunction(
                "__recordInput",
                async data => {

                  let value = data.value;

                  // Never save password values
                  if (data.password) {
                    value = "******";
                  }

                  addAction({
                    type: "type",
                    selector: data.selector,
                    value
                  });

                }
              );

            } catch (error) {
              // Already exposed
            }

            // --------------------------------------------------
            // Expose scroll
            // --------------------------------------------------

            try {

              await page.exposeFunction(
                "__recordScroll",
                async data => {

                  addAction({
                    type: "scroll",
                    x: data.x,
                    y: data.y
                  });

                }
              );

            } catch (error) {
              // Already exposed
            }

            // ==================================================
            // Inject recorder
            // ==================================================

            async function inject() {

              try {

                await page.evaluate(() => {

                  if (
                    window.__BROWSER_RECORDER_INSTALLED
                  ) {
                    return;
                  }

                  window.__BROWSER_RECORDER_INSTALLED = true;

                  // ==================================================
                  // Selector generator
                  // ==================================================

                  function selectorFor(el) {

                    if (!el) {
                      return null;
                    }

                    // ID
                    if (el.id) {

                      return "#" +
                        CSS.escape(el.id);

                    }

                    // data-testid
                    const testId =
                      el.getAttribute("data-testid");

                    if (testId) {

                      return `[data-testid="${CSS.escape(testId)}"]`;

                    }

                    // name
                    const name =
                      el.getAttribute("name");

                    if (name) {

                      return `${el.tagName.toLowerCase()}[name="${CSS.escape(name)}"]`;

                    }

                    // aria-label
                    const aria =
                      el.getAttribute("aria-label");

                    if (aria) {

                      return `${el.tagName.toLowerCase()}[aria-label="${CSS.escape(aria)}"]`;

                    }

                    // fallback
                    let current = el;

                    const parts = [];

                    while (
                      current &&
                      current.nodeType === Node.ELEMENT_NODE &&
                      parts.length < 5
                    ) {

                      let part =
                        current.tagName.toLowerCase();

                      if (
                        current.classList &&
                        current.classList.length
                      ) {

                        const classes =
                          [...current.classList]
                            .slice(0, 2)
                            .map(x => CSS.escape(x))
                            .join(".");

                        if (classes) {
                          part += "." + classes;
                        }

                      }

                      const parent =
                        current.parentElement;

                      if (parent) {

                        const siblings =
                          [...parent.children]
                            .filter(
                              x =>
                                x.tagName ===
                                current.tagName
                            );

                        if (siblings.length > 1) {

                          const index =
                            siblings.indexOf(current) + 1;

                          part +=
                            `:nth-of-type(${index})`;

                        }

                      }

                      parts.unshift(part);

                      current =
                        current.parentElement;

                    }

                    return parts.join(" > ");

                  }

                  // ==================================================
                  // CLICK
                  // ==================================================

                  document.addEventListener(
                    "click",
                    async event => {

                      let element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      // If SVG/path was clicked,
                      // find nearest useful element.
                      if (
                        element instanceof SVGElement
                      ) {

                        element =
                          element.closest(
                            "button, a, input, textarea, select, [role='button']"
                          ) || element;

                      }

                      const selector =
                        selectorFor(element);

                      try {

                        await window.__recordClick({

                          selector,

                          x:
                            event.clientX,

                          y:
                            event.clientY

                        });

                      } catch (error) {

                        console.error(
                          "Recorder click error:",
                          error
                        );

                      }

                    },
                    true
                  );

                  // ==================================================
                  // INPUT / TYPING
                  // ==================================================

                  document.addEventListener(
                    "input",
                    async event => {

                      const element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      if (
                        element instanceof HTMLInputElement ||
                        element instanceof HTMLTextAreaElement ||
                        element instanceof HTMLSelectElement
                      ) {

                        const selector =
                          selectorFor(element);

                        try {

                          await window.__recordInput({

                            selector,

                            value:
                              element.value,

                            password:
                              element instanceof HTMLInputElement &&
                              element.type === "password"

                          });

                        } catch (error) {

                          console.error(
                            "Recorder input error:",
                            error
                          );

                        }

                      }

                    },
                    true
                  );

                  // ==================================================
                  // CHANGE
                  // ==================================================

                  document.addEventListener(
                    "change",
                    async event => {

                      const element =
                        event.target;

                      if (!element) {
                        return;
                      }

                      if (
                        element instanceof HTMLSelectElement
                      ) {

                        const selector =
                          selectorFor(element);

                        try {

                          await window.__recordInput({

                            selector,

                            value:
                              element.value,

                            password: false

                          });

                        } catch (error) {

                          console.error(
                            "Recorder select error:",
                            error
                          );

                        }

                      }

                    },
                    true
                  );

                  // ==================================================
                  // SCROLL
                  // ==================================================

                  let lastX =
                    window.scrollX;

                  let lastY =
                    window.scrollY;

                  let scrollTimer =
                    null;

                  window.addEventListener(
                    "scroll",
                    () => {

                      clearTimeout(
                        scrollTimer
                      );

                      scrollTimer =
                        setTimeout(
                          async () => {

                            const x =
                              window.scrollX;

                            const y =
                              window.scrollY;

                            if (
                              Math.abs(x - lastX) < 50 &&
                              Math.abs(y - lastY) < 50
                            ) {
                              return;
                            }

                            lastX = x;
                            lastY = y;

                            try {

                              await window.__recordScroll({
                                x,
                                y
                              });

                            } catch (error) {

                              console.error(
                                "Recorder scroll error:",
                                error
                              );

                            }

                          },
                          150
                        );

                    },
                    {
                      passive: true
                    }
                  );

                  console.log(
                    "🟢 Browser Recorder injected"
                  );

                });

              } catch (error) {

                console.log(
                  "⚠️ Could not inject recorder:",
                  error.message
                );

              }

            }

            // Install into current document
            await inject();

            // ==================================================
            // Navigation
            // ==================================================

            page.on(
              "framenavigated",
              async frame => {

                if (
                  frame !== page.mainFrame()
                ) {
                  return;
                }

                const url =
                  frame.url();

                console.log(
                  "[RECORDER] Navigation:",
                  url
                );

                addAction({
                  type: "navigation",
                  url
                });

                await page
                  .waitForLoadState(
                    "domcontentloaded"
                  )
                  .catch(() => {});

                await inject();

              }
            );

          }

          // ==================================================
          // Main
          // ==================================================

          async function main() {

            console.log("");
            console.log(
              "===================================="
            );
            console.log(
              "🎥 BROWSER RECORDER STARTING"
            );
            console.log(
              "===================================="
            );
            console.log("");

            save();

            // ==================================================
            // Connect to Chromium CDP :9223
            // ==================================================

            let browser = null;

            for (
              let i = 1;
              i <= 30;
              i++
            ) {

              try {

                console.log(
                  `⏳ Connecting to CDP :9223... ${i}/30`
                );

                browser =
                  await chromium.connectOverCDP(
                    "http://127.0.0.1:9223"
                  );

                console.log(
                  "✅ Connected to Chromium"
                );

                break;

              } catch (error) {

                console.log(
                  "⚠️ CDP connection failed:",
                  error.message
                );

                if (i === 30) {
                  throw error;
                }

                await new Promise(
                  resolve =>
                    setTimeout(
                      resolve,
                      2000
                    )
                );

              }

            }

            // ==================================================
            // Existing contexts
            // ==================================================

            const contexts =
              browser.contexts();

            console.log(
              `📦 Contexts: ${contexts.length}`
            );

            for (
              const context of contexts
            ) {

              const pages =
                context.pages();

              console.log(
                `📄 Pages: ${pages.length}`
              );

              for (
                const page of pages
              ) {

                await installRecorder(
                  page
                );

              }

              // ==================================================
              // New pages / tabs
              // ==================================================

              context.on(
                "page",
                async page => {

                  console.log(
                    "🆕 New page:",
                    page.url()
                  );

                  await page
                    .waitForLoadState(
                      "domcontentloaded"
                    )
                    .catch(() => {});

                  await installRecorder(
                    page
                  );

                }
              );

            }

            console.log("");
            console.log(
              "===================================="
            );
            console.log(
              "🟢 RECORDER ACTIVE"
            );
            console.log(
              "===================================="
            );
            console.log("");

            console.log(
              "🖱️ کلیک‌ها ثبت می‌شوند"
            );

            console.log(
              "⌨️ تایپ‌ها ثبت می‌شوند"
            );

            console.log(
              "📜 اسکرول‌ها ثبت می‌شوند"
            );

            console.log(
              "🌐 Navigation ثبت می‌شود"
            );

            console.log(
              "🔐 مقدار password ذخیره نمی‌شود"
            );

            console.log("");
            console.log(
              "🌐 حالا وارد noVNC شو و کارهایت را انجام بده."
            );
            console.log("");

            // ==================================================
            // Graceful shutdown
            // ==================================================

            const shutdown =
              () => {

                console.log("");
                console.log(
                  "🛑 Stopping recorder..."
                );

                save();

                console.log(
                  `💾 ${actions.length} actions saved.`
                );

                process.exit(0);

              };

            process.on(
              "SIGINT",
              shutdown
            );

            process.on(
              "SIGTERM",
              shutdown
            );

            // Keep process alive
            await new Promise(
              () => {}
            );

          }

          main().catch(
            error => {

              console.error("");
              console.error(
                "❌ RECORDER ERROR"
              );

              console.error(
                error
              );

              save();

              process.exit(1);

            }
          );

          EOF

          echo "✅ recorder.js created"

      # ==================================================
      # 8. Open Requested Website
      # ==================================================
      - name: Open Website
        run: |
          set -e

          WEBSITE="${{ inputs.website }}"

          if [[ "$WEBSITE" != http://* && \
                "$WEBSITE" != https://* ]]; then

            WEBSITE="https://$WEBSITE"

          fi

          echo ""
          echo "🌐 Website:"
          echo "$WEBSITE"
          echo ""

          echo "⏳ Connecting to Chromium..."

          node <<'EOF'
          const { chromium } = require("playwright");

          (async () => {

            const website =
              process.env.WEBSITE;

            const browser =
              await chromium.connectOverCDP(
                "http://127.0.0.1:9223"
              );

            const contexts =
              browser.contexts();

            if (!contexts.length) {
              throw new Error(
                "No browser context found"
              );
            }

            const context =
              contexts[0];

            let pages =
              context.pages();

            let page =
              pages[0];

            if (!page) {

              page =
                await context.newPage();

            }

            console.log(
              "🌐 Opening:",
              website
            );

            await page.goto(
              website,
              {
                waitUntil: "domcontentloaded",
                timeout: 60000
              }
            );

            console.log(
              "✅ Website opened:"
            );

            console.log(
              page.url()
            );

            await new Promise(
              resolve =>
                setTimeout(resolve, 3000)
            );

            console.log("");
            console.log(
              "========== OPEN PAGES =========="
            );

            for (
              const p of context.pages()
            ) {

              console.log(
                p.url()
              );

            }

            console.log(
              "================================"
            );

          })().catch(
            error => {

              console.error(
                "❌ Cannot open website"
              );

              console.error(
                error
              );

              process.exit(1);

            }
          );
          EOF
        env:
          WEBSITE: ${{ inputs.website }}

      # ==================================================
      # 9. Install Cloudflared
      # ==================================================
      - name: Install Cloudflared
        run: |
          set -e

          echo "⏳ نصب cloudflared..."

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ==================================================
      # 10. Start Cloudflare Tunnel
      # ==================================================
      - name: Start Cloudflare Tunnel
        run: |
          set -e

          echo "⏳ شروع Cloudflare Tunnel..."

          cloudflared tunnel \
            --url http://127.0.0.1:5800 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" \
            > /tmp/cloudflared.pid

          echo "⏳ منتظر URL..."

          TUNNEL_URL=""

          for i in {1..60}; do

            TUNNEL_URL=$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                | head -n 1 \
                || true
            )

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            echo \
              "⏳ هنوز URL ساخته نشده... $i/60"

            sleep 2

          done

          echo ""
          echo "=========================================="
          echo "🌐 NO VNC URL"
          echo "=========================================="

          echo "$TUNNEL_URL"

          echo "=========================================="
          echo ""

          echo "🔐 VNC Password:"
          echo "your_password"

          echo ""

          if [ -z "$TUNNEL_URL" ]; then

            echo \
              "❌ Cloudflare Tunnel URL پیدا نشد"

            echo ""

            cat \
              /tmp/cloudflared.log

            exit 1

          fi

          echo \
            "TUNNEL_URL=$TUNNEL_URL" \
            >> "$GITHUB_ENV"

      # ==================================================
      # 11. Start Recorder
      # ==================================================
      - name: Start Recorder
        run: |
          echo ""
          echo "=========================================="
          echo "🎥 STARTING BROWSER RECORDER"
          echo "=========================================="
          echo ""

          echo "🌐 noVNC URL:"
          echo "${TUNNEL_URL}"

          echo ""

          echo "🔐 Password:"
          echo "your_password"

          echo ""

          echo "=========================================="
          echo "🟢 Recorder is starting..."
          echo "=========================================="
          echo ""

          node recorder.js

      # ==================================================
      # 12. Upload Recording
      # ==================================================
      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording
          path: |
            recording.json
          if-no-files-found: warn

      # ==================================================
      # 13. Upload Debug Logs
      # ==================================================
      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug-logs
          path: |
            /tmp/cloudflared.log
            /tmp/cdp-version.json
          if-no-files-found: warn

      # ==================================================
      # 14. Cleanup
      # ==================================================
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."

          if [ -f /tmp/cloudflared.pid ]; then

            kill \
              "$(cat /tmp/cloudflared.pid)" \
              2>/dev/null || true

          fi

          docker stop chromium \
            2>/dev/null || true

          docker rm chromium \
            2>/dev/null || true

          echo "✅ Cleanup completed"
