name: Browser Recorder - noVNC

on:
  workflow_dispatch:
    inputs:
      website:
        description: "آدرس سایت"
        required: true
        type: string
        default: "https://example.com"

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # 1. اجرای Chromium + noVNC
      # --------------------------------------------------
      - name: Start Chromium
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -e CHROME_CLI="--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0" \
            -p 5800:5800 \
            -p 9222:9222 \
            jlesage/chromium:latest

      # --------------------------------------------------
      # 2. نصب Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------
      # 3. نصب Playwright
      # --------------------------------------------------
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      # --------------------------------------------------
      # 4. صبر برای آماده شدن Chromium
      # --------------------------------------------------
      - name: Wait for Chromium
        run: |
          echo "⏳ منتظر Chromium..."

          for i in {1..60}; do
            if curl -s http://127.0.0.1:9222/json/version > /dev/null; then
              echo "✅ Chromium آماده است"
              break
            fi

            sleep 2
          done

      # --------------------------------------------------
      # 5. باز کردن سایت
      # --------------------------------------------------
      - name: Open Website
        run: |
          WEBSITE="${{ inputs.website }}"

          echo "🌐 Website:"
          echo "$WEBSITE"

          curl -s \
            -X PUT \
            "http://127.0.0.1:9222/json/new?${WEBSITE}" \
            || true

      # --------------------------------------------------
      # 6. ساخت Recorder
      # --------------------------------------------------
      - name: Create Recorder
        run: |

          cat > recorder.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const OUTPUT = "recording.json";

          let actions = [];

          /*
           * فقط اطلاعات لازم برای Replay ذخیره می‌شود.
           * Timestamp عمداً ذخیره نمی‌شود.
           */

          function save() {
            fs.writeFileSync(
              OUTPUT,
              JSON.stringify(actions, null, 2)
            );
          }

          function addAction(action) {
            actions.push(action);

            console.log(
              "[RECORDER]",
              JSON.stringify(action)
            );

            save();
          }

          async function selectorFor(page, element) {
            return await element.evaluate((el) => {

              if (!el) return null;

              // ID
              if (el.id) {
                return "#" + CSS.escape(el.id);
              }

              // name
              if (el.getAttribute("name")) {
                return `${el.tagName.toLowerCase()}[name="${CSS.escape(el.getAttribute("name"))}"]`;
              }

              // data-testid
              if (el.getAttribute("data-testid")) {
                return `[data-testid="${CSS.escape(el.getAttribute("data-testid"))}"]`;
              }

              // fallback
              const parts = [];

              let current = el;

              while (
                current &&
                current.nodeType === Node.ELEMENT_NODE &&
                parts.length < 5
              ) {

                let part = current.tagName.toLowerCase();

                if (current.classList.length) {
                  part += "." + [...current.classList]
                    .slice(0, 2)
                    .map(x => CSS.escape(x))
                    .join(".");
                }

                const parent = current.parentElement;

                if (parent) {
                  const siblings = [...parent.children]
                    .filter(x => x.tagName === current.tagName);

                  if (siblings.length > 1) {
                    part += `:nth-of-type(${siblings.indexOf(current) + 1})`;
                  }
                }

                parts.unshift(part);

                current = current.parentElement;
              }

              return parts.join(" > ");

            });
          }

          async function installRecorder(page) {

            console.log("📄 Recorder attached:", page.url());

            /*
             * Click
             */

            await page.exposeFunction(
              "__recordClick",
              async (data) => {

                addAction({
                  type: "click",
                  selector: data.selector,
                  x: data.x,
                  y: data.y
                });

              }
            );

            /*
             * Input / typing
             */

            await page.exposeFunction(
              "__recordInput",
              async (data) => {

                let value = data.value;

                if (data.password) {
                  value = "******";
                }

                addAction({
                  type: "type",
                  selector: data.selector,
                  value
                });

              }
            );

            /*
             * Scroll
             */

            await page.exposeFunction(
              "__recordScroll",
              async (data) => {

                addAction({
                  type: "scroll",
                  x: data.x,
                  y: data.y
                });

              }
            );

            /*
             * Navigation
             */

            await page.exposeFunction(
              "__recordNavigation",
              async (url) => {

                addAction({
                  type: "navigation",
                  url
                });

              }
            );

            await page.addInitScript(() => {

              /*
               * CLICK
               */

              document.addEventListener(
                "click",
                async (event) => {

                  const element = event.target;

                  if (!element) return;

                  let selector = null;

                  if (element.id) {

                    selector = "#" + CSS.escape(element.id);

                  } else if (element.getAttribute("name")) {

                    selector =
                      `${element.tagName.toLowerCase()}[name="${CSS.escape(element.getAttribute("name"))}"]`;

                  } else {

                    selector =
                      element.tagName.toLowerCase();

                  }

                  await window.__recordClick({

                    selector,

                    x: event.clientX,

                    y: event.clientY

                  });

                },
                true
              );

              /*
               * TYPE
               */

              document.addEventListener(
                "input",
                async (event) => {

                  const element = event.target;

                  if (!element) return;

                  if (
                    element instanceof HTMLInputElement ||
                    element instanceof HTMLTextAreaElement ||
                    element instanceof HTMLSelectElement
                  ) {

                    let selector = null;

                    if (element.id) {

                      selector =
                        "#" + CSS.escape(element.id);

                    } else if (element.name) {

                      selector =
                        `${element.tagName.toLowerCase()}[name="${CSS.escape(element.name)}"]`;

                    } else {

                      selector =
                        element.tagName.toLowerCase();

                    }

                    await window.__recordInput({

                      selector,

                      value: element.value,

                      password:
                        element.type === "password"

                    });

                  }

                },
                true
              );

              /*
               * SCROLL
               */

              let lastY = window.scrollY;

              window.addEventListener(
                "scroll",
                async () => {

                  const y = window.scrollY;

                  if (Math.abs(y - lastY) < 50) {
                    return;
                  }

                  lastY = y;

                  await window.__recordScroll({

                    x: window.scrollX,

                    y

                  });

                },
                {
                  passive: true
                }
              );

            });

            /*
             * Navigation
             */

            page.on(
              "framenavigated",
              frame => {

                if (frame === page.mainFrame()) {

                  addAction({
                    type: "navigation",
                    url: frame.url()
                  });

                }

              }
            );

          }

          async function main() {

            console.log("================================");
            console.log("🎥 RECORDER STARTING");
            console.log("================================");

            const browser =
              await chromium.connectOverCDP(
                "http://127.0.0.1:9222"
              );

            const contexts =
              browser.contexts();

            for (const context of contexts) {

              const pages =
                context.pages();

              for (const page of pages) {

                await installRecorder(page);

              }

              context.on(
                "page",
                async page => {

                  await installRecorder(page);

                }
              );

            }

            console.log("");
            console.log("🟢 RECORDER ACTIVE");
            console.log("🟢 حالا وارد مرورگر شو و کارهایت را انجام بده.");
            console.log("");
            console.log("📌 کلیک، تایپ، اسکرول و Navigation ثبت می‌شوند.");
            console.log("📌 زمان ذخیره نمی‌شود.");
            console.log("");

            /*
             * زنده نگه داشتن Recorder
             */

            process.on(
              "SIGINT",
              () => {

                save();

                process.exit(0);

              }
            );

            process.on(
              "SIGTERM",
              () => {

                save();

                process.exit(0);

              }
            );

            await new Promise(
              () => {}
            );

          }

          main().catch(error => {

            console.error(error);

            process.exit(1);

          });

          EOF

      # --------------------------------------------------
      # 7. اجرای Recorder
      # --------------------------------------------------
      - name: Start Recorder
        run: |
          node recorder.js

      # --------------------------------------------------
      # 8. ذخیره recording.json
      # --------------------------------------------------
      - name: Upload Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording
          path: recording.json
